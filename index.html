cial accounting","Management accounting","Auditing","Tax accounting"],answer:1,explanation:"Management accounting is internal — it provides budgets, cost analysis, and forecasts to help MANAGERS make decisions like this."},{q:"Which is a characteristic of MANAGEMENT accounting?",options:["Must follow AASB standards","Reported annually","Flexible and forward-looking","Audited by external auditors"],answer:2,explanation:"Management accounting is flexible — no mandatory format, can be daily/weekly, and focuses on future decisions, not just past results."},{q:"In a partnership, who is personally liable for the business's debts?",options:["Only the managing partner","No one — liability is limited","All partners jointly","Only creditors"],answer:2,explanation:"In a partnership, ALL partners share unlimited joint liability — creditors can pursue personal assets of any partner."}],2:[{q:"Information is RELEVANT if it:",options:["Is always 100% accurate","Can influence users' decisions","Is prepared by an accountant","Follows AASB standards"],answer:1,explanation:"Relevance = the information has the ability to MAKE A DIFFERENCE to decisions. It has predictive value, confirmatory value, or both."},{q:"'Faithful representation' means financial information must be:",options:["Presented attractively","Complete, neutral, and free from error","Verified by a manager","Reviewed quarterly"],answer:1,explanation:"Faithful representation requires info to be COMPLETE (nothing left out), NEUTRAL (no bias), and FREE FROM ERROR (no mistakes)."},{q:"Which enhancing characteristic means different companies' reports can be meaningfully compared?",options:["Verifiability","Understandability","Comparability","Timeliness"],answer:2,explanation:"COMPARABILITY allows users to identify similarities and differences between entities — essential for investment decisions."},{q:"An item is MATERIAL if:",options:["It is made of physical material","Omitting it could influence a user's decision","It costs more than $1,000","It is listed on the balance sheet"],answer:1,explanation:"Materiality is about SIZE and NATURE — if omitting or misstating an item could change a user's decision, it is material."}],3:[{q:"Which BEST describes an asset under the Conceptual Framework?",options:["Something the business owes","A resource controlled by the business expected to bring future economic benefits","The owner's personal property","Any item purchased in the last year"],answer:1,explanation:"An asset has 3 key parts: (1) controlled by the entity, (2) arising from a past event, (3) expected future economic benefits."},{q:"Under the ACCRUAL basis, when is revenue recognised?",options:["When cash is received","When the invoice is sent","When the good/service is delivered (performance obligation met)","At year end only"],answer:2,explanation:"Accrual basis = recognise revenue when EARNED (service delivered / goods transferred), regardless of when cash arrives."},{q:"Harry's Store buys a laptop for $3,000 with a 3-year life and no residual value. Annual straight-line depreciation?",options:["$500","$750","$1,000","$3,000"],answer:2,explanation:"(Cost − Residual) ÷ Life = ($3,000 − $0) ÷ 3 = $1,000 per year. The matching principle spreads cost over the asset's useful life."},{q:"After 2 years of use, what is the CARRYING AMOUNT of that laptop?",options:["$3,000","$2,000","$1,000","$0"],answer:2,explanation:"Carrying amount = Cost − Accumulated Depreciation = $3,000 − ($1,000 × 2) = $1,000. This appears on the Balance Sheet."},{q:"Highope Ltd spent $300k exploring for platinum (no experience, none found). These costs FAIL asset recognition because:",options:["The amount is too small","Future economic benefits are NOT probable — no platinum found and no experience","They don't have a mining licence","The cost was not paid in cash"],answer:1,explanation:"For recognition, future benefits must be PROBABLE. With no platinum found and no prior experience, this fails the probability test → expense it."},{q:"A liability must involve:",options:["A future benefit flowing INTO the business","A present obligation requiring a future outflow of resources","An asset that has lost value","A payment made this year"],answer:1,explanation:"Liability = PRESENT obligation (from past event) that will require the business to sacrifice resources in the future (e.g. pay cash, deliver goods)."}],4:[{q:"Which BEST describes an asset?",options:["Something the business owes","A resource controlled by the business with future economic benefits","The owner's personal property","Any purchased item"],answer:1,explanation:"Assets are controlled, arise from past events, and are expected to generate future economic benefits."},{q:"The recognition criteria require that an item must be:",options:["Listed in AASB standards only","Meet the definition AND be probable AND reliably measurable","Approved by the board","Paid for in cash"],answer:1,explanation:"TWO tests: (1) Meet the element DEFINITION, (2) Probable future benefit/outflow AND reliably measurable amount."},{q:"EQUITY is best defined as:",options:["Cash held by the business","Total revenue minus total expenses","Assets minus Liabilities — the owner's residual interest","The business's borrowings"],answer:2,explanation:'Equity = Assets − Liabilities. It\'s what\'s LEFT for the owner after all debts are paid. Also called "net assets" or "owner\'s equity".'},{q:"Wages incurred but not yet paid should be recognised as:",options:["An asset (prepaid wages)","Nothing until paid","A liability (accrued wages) and an expense","Owner's equity reduction only"],answer:2,explanation:"Under accrual accounting: expense when INCURRED, not when paid. The unpaid obligation = liability. Equity decreases via the expense."}],5:[{q:"A business buys equipment for $8,000 cash. How does the accounting equation change?",options:["Assets +$8,000, Liabilities +$8,000","Assets stay the same (Cash −$8,000, Equipment +$8,000)","Equity decreases by $8,000","Liabilities decrease by $8,000"],answer:1,explanation:"This is an ASSET SWAP — one asset (cash) decreases, another (equipment) increases by the same amount. Total assets unchanged."},{q:"The owner withdraws $500 cash for personal use. What happens?",options:["Assets +$500, Equity +$500","Assets −$500, Equity −$500 (drawings reduce equity)","Assets −$500, Liabilities +$500","No effect"],answer:1,explanation:"Drawings reduce BOTH assets (cash out) AND equity (owner's stake decreases). This is NOT an expense — it's a distribution."},{q:"After all 5 transactions in the sneaker business, what is the final Owner's Equity?",options:["$15,000","$13,500","$12,000","$1,500"],answer:2,explanation:"Start $15,000 + Revenue $3,000 − Drawings $1,000 = $17,000... wait, no loan repayment affects equity. Equity = Assets($13,500) − Liabilities($1,500) = $12,000 ✓"},{q:"Why must the accounting equation ALWAYS balance?",options:["It's a legal requirement","Every transaction has dual equal effects — double-entry bookkeeping","Accountants check it manually each day","Software forces it to balance"],answer:1,explanation:"Double-entry system: EVERY transaction affects at least 2 accounts in equal and opposite ways. This is the foundation of all accounting."}],6:[{q:"A business earns $2,000 interest that has NOT yet been received. This is:",options:["Prepaid expense","Accrued revenue","Unearned revenue","Accrued expense"],answer:1,explanation:"ACCRUED REVENUE = earned but not yet received in cash. We recognise the revenue now (accrual basis) and record a receivable asset."},{q:"The business owes $3,500 in wages (work done, not yet paid). Effect on the equation?",options:["Assets ↓, Equity ↓","Liabilities ↑, Equity ↓ (expense recognised)","Assets ↑, Liabilities ↑","No effect until paid"],answer:1,explanation:"ACCRUED EXPENSE: expense is recognised NOW (incurred), creating a liability (wages payable). No cash movement yet."},{q:"$1,200 insurance paid covering the NEXT 6 months. Initially recorded as:",options:["Insurance expense","Prepaid insurance (asset)","Unearned insurance","Accrued insurance"],answer:1,explanation:"PREPAID EXPENSE: paying in advance for a future benefit. Cash paid → asset created (prepaid insurance). The expense is recognised as time passes."},{q:"Customer prepays $2,500 for services to be delivered NEXT period. This creates:",options:["Revenue immediately","An asset (receivable)","A liability (unearned revenue)","An expense"],answer:2,explanation:"UNEARNED REVENUE: received cash but service not yet delivered → LIABILITY. Revenue recognised only when service is performed."},{q:"Incurred $900 electricity not yet paid. This end-of-period adjustment will:",options:["Increase assets and equity","Decrease assets","Increase liabilities and decrease equity (expense)","Have no effect this period"],answer:2,explanation:"Electricity expense incurred = expense recognised (reduces equity) + liability created (electricity payable). No cash movement yet."}],7:[{q:"Received $15,000 from a customer for goods already sold. Cash flow classification?",options:["Investing","Financing","Operating","Not included"],answer:2,explanation:"OPERATING — collecting from customers is a core day-to-day business activity. It's the main source of operating cash inflows."},{q:"A business PURCHASES new machinery for $80,000 cash. Classification?",options:["Operating","Investing","Financing","Non-cash transaction"],answer:1,explanation:"INVESTING — buying/selling long-term assets (property, plant, equipment) is an investing activity. It shows how the business is growing its asset base."},{q:"The company REPAYS $20,000 of a bank loan. Classification?",options:["Operating","Investing","Financing","Both Operating and Financing"],answer:2,explanation:"FINANCING — repaying borrowings relates to how the business is funded. Financing activities involve debt and equity capital."},{q:"Why is POSITIVE Operating cash flow particularly important?",options:["It means the business bought assets","It shows the core business generates real cash (not just profit on paper)","It means borrowings increased","It confirms reported profit is high"],answer:1,explanation:"A business can show profit but have negative operating cash flow (e.g. if customers haven't paid). Positive operating cash flow = business is truly healthy."},{q:"Paid a $5,000 dividend to shareholders. Classification?",options:["Operating","Investing","Financing","Expense"],answer:2,explanation:"FINANCING — dividends are a return to equity providers (shareholders). Under AASB, dividends paid = financing outflow."}],8:[{q:"Contribution margin per unit is calculated as:",options:["Revenue − Fixed Costs","Selling Price − Variable Cost per unit","Net Profit ÷ Units Sold","Total Revenue ÷ Total Costs"],answer:1,explanation:"CM = Selling Price − Variable Cost. It's what's LEFT per unit to COVER fixed costs, then generate profit. Think: \"contribution to fixed costs and profit.\""},{q:"A café: Fixed costs $4,000/month, CM per unit $8. Break-even in UNITS?",options:["200 units","400 units","500 units","1,000 units"],answer:2,explanation:"Break-even = Fixed Costs ÷ CM = $4,000 ÷ $8 = 500 toasties. At 500, revenue exactly covers all costs — zero profit, zero loss."},{q:"Selling price drops from $12 to $10 (variable cost $4 unchanged). How does break-even change?",options:["It decreases — easier to break even","It stays the same","It increases — need to sell MORE units","Cannot be determined"],answer:2,explanation:"New CM = $10 − $4 = $6. New break-even = $4,000 ÷ $6 = 667 units (was 500). Lower price = lower CM = higher break-even = MORE RISK."},{q:"To earn a target profit of $2,000 with CM=$8 and Fixed Costs=$4,000, how many units needed?",options:["500","625","750","1,000"],answer:2,explanation:"Target units = (Fixed Costs + Target Profit) ÷ CM = ($4,000 + $2,000) ÷ $8 = $6,000 ÷ $8 = 750 toasties."}],9:[{q:"Alpha Division: Operating Profit $400,000, Total Investment $2,500,000. ROI =?",options:["12%","14%","16%","20%"],answer:2,explanation:"ROI = Operating Profit ÷ Total Investment = $400,000 ÷ $2,500,000 = 0.16 = 16%. This tells us: for every $1 invested, Alpha earns 16 cents."},{q:"Beta Division: Profit $280,000, Investment $1,600,000, Required Return 12%. Residual Income?",options:["$88,000","$192,000","$280,000","−$88,000"],answer:0,explanation:"RI = Operating Profit − (Investment × Required Rate) = $280,000 − ($1,600,000 × 12%) = $280,000 − $192,000 = $88,000. Beta creates $88k above minimum."},{q:"Which division has the HIGHER ROI?",options:["Alpha (16%)","Beta (17.5%)","They are equal","Cannot be determined"],answer:1,explanation:"Beta ROI = $280,000 ÷ $1,600,000 = 17.5% > Alpha's 16%. Beta looks better on ROI despite earning less absolute profit."},{q:"A manager evaluated ONLY on ROI might make what dysfunctional decision?",options:["Always accept profitable investments","Reject investments that beat the required rate but lower their division's ROI","Always maximise company value","Focus on long-term growth"],answer:1,explanation:"KEY EXAM POINT: If a manager's bonus depends on ROI, they'll reject any investment below their current ROI — even if it exceeds the required return and adds value. RI fixes this."}],10:[{q:"Pine Ltd: Sales $3,000,000, Net Profit $240,000. Profit margin?",options:["5%","8%","12.5%","20%"],answer:1,explanation:"Profit Margin = Net Profit ÷ Sales = $240,000 ÷ $3,000,000 = 0.08 = 8%. Pine keeps 8 cents of profit for every $1 of sales."},{q:"Pine Ltd: Sales $3,000,000, Average Total Assets $1,200,000. Asset turnover?",options:["1.5 times","2.0 times","2.5 times","4.0 times"],answer:2,explanation:"Asset Turnover = Sales ÷ Avg Total Assets = $3,000,000 ÷ $1,200,000 = 2.5×. Pine generates $2.50 of sales for every $1 of assets."},{q:"Using DuPont, Pine Ltd's ROA = Profit Margin × Asset Turnover =?",options:["10%","15%","20%","25%"],answer:2,explanation:"ROA = 8% × 2.5 = 20%. Verify: $240,000 ÷ $1,200,000 = 20% ✓. DuPont shows ROA is driven by BOTH efficiency and profitability."},{q:"To improve ROA via ASSET TURNOVER, the best strategy is:",options:["Cut advertising costs (improves margin)","Generate more revenue from the same asset base","Increase borrowings","Reduce selling price permanently"],answer:1,explanation:"Improving asset turnover = generate MORE sales without buying more assets. E.g. better inventory management, faster receivables collection."}]},d=[{label:"Owner invests $15,000 cash",cash:15e3,equip:0,supplies:0,ap:0,equity:15e3,note:"Starting capital contribution → Assets ↑, Equity ↑"},{label:"T1: Buy equipment $5,000 cash",cash:1e4,equip:5e3,supplies:0,ap:0,equity:15e3,note:"Asset swap — Cash ↓, Equipment ↑. Total assets unchanged."},{label:"T2: Buy supplies $2,000 on credit",cash:1e4,equip:5e3,supplies:2e3,ap:2e3,equity:15e3,note:"Assets ↑ (supplies), Liabilities ↑ (accounts payable)"},{label:"T3: Cash sales $3,000",cash:13e3,equip:5e3,supplies:2e3,ap:2e3,equity:18e3,note:"Revenue earned → Assets ↑ (cash), Equity ↑ (via revenue)"},{label:"T4: Repay $500 of loan",cash:12500,equip:5e3,supplies:2e3,ap:1500,equity:18e3,note:"Assets ↓ (cash), Liabilities ↓ (accounts payable). Equity unchanged."},{label:"T5: Owner withdraws $1,000",cash:11500,equip:5e3,supplies:2e3,ap:1500,equity:17e3,note:"Drawings → Assets ↓ (cash), Equity ↓. Not an expense!"}],f=({color:e,label:t,children:n})=>(0,i.jsxs)("div",{className:`rounded border-l-4 p-4 mb-4 ${e}`,children:[(0,i.jsx)("div",{className:"text-xs font-bold uppercase tracking-wider mb-2 opacity-70",children:t}),n]}),p=({children:e})=>(0,i.jsx)("div",{className:"bg-[#0d1117] border border-[#30363d] rounded px-4 py-3 my-3 font-mono text-sm text-green-400 text-center",children:e}),m=({children:e})=>(0,i.jsxs)("div",{className:"flex gap-3 bg-yellow-500/10 border border-yellow-500/30 rounded p-3 mb-4 text-sm",children:[(0,i.jsx)("span",{className:"text-yellow-400 text-lg",children:"💡"}),(0,i.jsx)("div",{className:"text-yellow-100",children:e}
