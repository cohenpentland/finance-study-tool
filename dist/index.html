ent accounting is internal — it provides budgets, forecasts and cost analysis to support decisions like this one."},{q:"Which is a key characteristic of MANAGEMENT accounting?",options:["Must follow AASB standards","Always reported annually","Flexible and forward-looking","Audited by external auditors"],answer:2,explanation:"Management accounting is flexible — no mandatory format, prepared as often as needed, and focused on FUTURE decisions."},{q:"In a partnership, who is personally liable for the business's debts?",options:["Only the managing partner","No one — liability is limited","All partners jointly","Only the creditors"],answer:2,explanation:"Partners share UNLIMITED joint liability — creditors can pursue the personal assets of any partner to recover debts."},{q:"Financial accounting reports must follow which set of rules?",options:["The owner's preferences","AASB accounting standards","No formal rules","Marketing guidelines"],answer:1,explanation:"Financial accounting is standardised — it must comply with AASB (Australian Accounting Standards Board) standards so reports are comparable."},{q:"Which type of report is MANDATORY and often externally audited?",options:["A monthly sales budget","Financial accounting statements","An internal cost report","A break-even analysis"],answer:1,explanation:"Financial statements are mandatory for companies and are frequently audited. Internal management reports are neither required nor audited."},{q:"What is the TIME FOCUS of management accounting?",options:["Strictly historical (past only)","Future-oriented (forecasts and budgets)","Only the current day","It has no time focus"],answer:1,explanation:"Management accounting looks FORWARD — budgets, forecasts and projections — to guide decisions. Financial accounting reports the past."},{q:"A sole trader is BEST described as:",options:["A separate legal entity from the owner","A business owned by one person with unlimited liability","A company with one shareholder","A type of trust"],answer:1,explanation:"A sole trader is one person who owns the business. It is NOT a separate legal entity, so the owner has unlimited personal liability."},{q:"Which structure is a SEPARATE LEGAL ENTITY that can own assets and be sued in its own name?",options:["Sole trader","Partnership","Company","None of these"],answer:2,explanation:"A company has its own legal identity — it can own property, enter contracts, sue and be sued, separately from its owners."},{q:"Who would typically prepare and use BUDGETS and forecasts?",options:["External investors","Management accountants (internal)","Bank loan officers","The tax office"],answer:1,explanation:"Budgets and forecasts are internal planning tools — the domain of management accounting used by managers."},{q:"How often are financial accounting statements usually reported?",options:["Every hour","Annually (sometimes quarterly)","Only when the business closes","Whenever a manager asks"],answer:1,explanation:"Financial statements follow a regular external reporting cycle — typically annual, sometimes half-yearly or quarterly."},{q:"In a trust, who holds the assets on behalf of others?",options:["The beneficiaries","The trustee","The auditor","The shareholders"],answer:1,explanation:"A trustee legally holds and manages the trust's assets FOR the benefit of the beneficiaries."},{q:"Which structure is commonly used for ASSET PROTECTION and family tax planning?",options:["Sole trader","Partnership","Trust","None of these"],answer:2,explanation:"Trusts are often used to protect assets and distribute income flexibly among beneficiaries (e.g. family members)."},{q:"A major ADVANTAGE of being a sole trader is:",options:["Limited liability","Simple and inexpensive to set up","Access to unlimited capital","Separate legal status"],answer:1,explanation:"Sole traders are cheap and easy to establish with minimal regulation — the main trade-off is unlimited personal liability."},{q:"A key DISADVANTAGE of a partnership is:",options:["It is taxed at 30%","Partners have unlimited joint liability","It cannot have employees","It must publish accounts publicly"],answer:1,explanation:"Each partner is jointly liable for ALL the partnership's debts — one partner's actions can expose the others personally."},{q:"Management accounting information is used by:",options:["External investors deciding to buy shares","Internal managers making operating decisions","Banks assessing a loan","The ATO assessing tax"],answer:1,explanation:"Management accounting is INTERNAL — its whole purpose is to help managers run and improve the business."},{q:"The main purpose of FINANCIAL accounting is to:",options:["Help managers set next year's budget","Provide external users with information for decisions and accountability","Calculate the factory's hourly output","Decide staff rosters"],answer:1,explanation:"Financial accounting gives external stakeholders a true and fair view of performance and position for decision-making and accountability."},{q:"The owners of a company are called:",options:["Partners","Shareholders","Trustees","Sole traders"],answer:1,explanation:"Company owners hold shares, so they are shareholders. Their liability is limited to the amount they paid for their shares."},{q:"Which accounting would help a manager decide the best PRICE for a new product?",options:["Financial accounting","Management accounting","Audit accounting","Statutory reporting"],answer:1,explanation:"Pricing decisions rely on internal cost and volume data — that is management accounting (e.g. CVP analysis)."}],2:[{q:"Information is RELEVANT if it:",options:["Is always 100% accurate","Can influence users' economic decisions","Is prepared by a qualified accountant","Follows AASB formatting"],answer:1,explanation:"Relevance = the ability to MAKE A DIFFERENCE to decisions, through predictive value, confirmatory value, or both."},{q:"'Faithful representation' requires information to be:",options:["Presented attractively","Complete, neutral, and free from error","Verified by a manager","Reviewed every quarter"],answer:1,explanation:"Faithful representation has three parts: COMPLETE (nothing missing), NEUTRAL (unbiased), and FREE FROM ERROR."},{q:"Which enhancing characteristic lets users compare different companies' reports meaningfully?",options:["Verifiability","Understandability","Comparability","Timeliness"],answer:2,explanation:"Comparability allows users to identify similarities and differences between entities and over time."},{q:"An item is MATERIAL if:",options:["It is made of physical material","Omitting or misstating it could influence a user's decision","It costs more than $1,000","It appears on the balance sheet"],answer:1,explanation:"Materiality is entity-specific — if leaving it out (or getting it wrong) could change a decision, it's material."},{q:"What are the TWO fundamental qualitative characteristics?",options:["Relevance and Faithful Representation","Comparability and Timeliness","Profit and Cash","Assets and Liabilities"],answer:0,explanation:"The two FUNDAMENTAL characteristics are Relevance and Faithful Representation. The other four are ENHANCING."},{q:"'Predictive value' is a component of which characteristic?",options:["Relevance","Verifiability","Timeliness","Understandability"],answer:0,explanation:"Predictive value (helping forecast the future) is part of RELEVANCE, along with confirmatory value and materiality."},{q:"'Confirmatory value' means information:",options:["Predicts next year's sales","Confirms or corrects previous evaluations","Is checked by an auditor","Is easy to read"],answer:1,explanation:"Confirmatory value gives feedback that confirms or changes prior assessments — a key part of relevance."},{q:"For information to be NEUTRAL it must be:",options:["Free from bias and not manipulated","Always positive","Approved by the directors","Rounded to the nearest dollar"],answer:0,explanation:"Neutral = no bias. It is not slanted, weighted, or manipulated to produce a favourable or unfavourable outcome."},{q:"How many ENHANCING qualitative characteristics are there?",options:["Two","Three","Four","Six"],answer:2,explanation:"There are FOUR enhancing characteristics: Comparability, Verifiability, Timeliness, Understandability (C-V-T-U)."},{q:"'Verifiability' means:",options:["Information is delivered on time","Different knowledgeable observers could reach the same conclusion","The CEO has signed off","It is written in plain English"],answer:1,explanation:"Verifiability means independent, knowledgeable observers could agree that the information faithfully represents what it claims."},{q:"'Timeliness' means information is:",options:["Available in time to influence decisions","Always about the future","Updated every minute","Older than 12 months"],answer:0,explanation:"Timeliness = having information available while it can still affect decisions. Stale information loses its usefulness."},{q:"'Understandability' is improved by:",options:["Using complex jargon","Clear classification and concise presentation","Hiding the detail","Removing all notes"],answer:1,explanation:"Understandability means information is classified, characterised and presented clearly for reasonably knowledgeable users."},{q:"For information to be COMPLETE it must:",options:["Include everything material a user needs to understand it","Be exactly one page","Only show positives","Exclude estimates"],answer:0,explanation:"Complete means including all information necessary for a user to understand the item — nothing material left out."},{q:"'Free from error' means:",options:["Every figure is 100% exact and certain","No errors in the description or process used","The report was audited","There are no estimates"],answer:1,explanation:"Free from error does NOT mean perfectly accurate — estimates are allowed if the process is described and applied without error."},{q:"Which of these is an ENHANCING (not fundamental) characteristic?",options:["Relevance","Faithful representation","Comparability","Materiality"],answer:2,explanation:"Comparability is an ENHANCING characteristic. Relevance and faithful representation are fundamental; materiality is part of relevance."},{q:"Can enhancing characteristics make IRRELEVANT information useful?",options:["Yes, if it is timely","No — they only enhance information that is already relevant and faithful","Yes, if it is comparable","Only if verified"],answer:1,explanation:"Enhancing characteristics boost useful information but cannot rescue information that fails the two fundamentals."},{q:"Applying accounting policies CONSISTENTLY over time mainly supports:",options:["Timeliness","Comparability","Materiality","Neutrality"],answer:1,explanation:"Consistency (same methods each period) is what makes results COMPARABLE across time, though it is not the same thing as comparability."},{q:"The Conceptual Framework is issued by:",options:["The ATO","The AASB","The company's directors","The auditors"],answer:1,explanation:"In Australia the Conceptual Framework is set by the AASB — it underpins all the individual accounting standards."},{q:"The main purpose of the Conceptual Framework is to:",options:["Replace all accounting standards","Provide the concepts that underpin and guide accounting standards","Calculate company tax","Set share prices"],answer:1,explanation:"It is the 'rulebook behind the rules' — providing the foundational concepts that guide standard-setting and accounting choices."},{q:"There is sometimes a TRADE-OFF between timeliness and:",options:["Having complete, fully verified information","Using the AASB logo","Paying dividends","The colour of the report"],answer:0,explanation:"Reporting quickly (timeliness) may mean reporting before every detail is confirmed — a trade-off with completeness/faithfulness."}],3:[{q:"Under the CASH basis, transactions are recorded when:",options:["The transaction occurs","Cash actually changes hands","An invoice is issued","The year ends"],answer:1,explanation:"Cash basis = record only when CASH is received or paid. Simple, but it can misrepresent true performance."},{q:"Under the ACCRUAL basis, transactions are recorded when:",options:["Cash is received","The transaction/economic event occurs","The bank statement arrives","The owner decides"],answer:1,explanation:"Accrual basis = record when the event OCCURS (revenue earned, expense incurred), regardless of cash timing."},{q:"Which basis must companies use under AASB standards?",options:["Cash basis","Accrual basis","Either one","Neither"],answer:1,explanation:"AASB requires the ACCRUAL basis because it gives a more accurate picture of performance and position."},{q:"You do $5,000 of work in June but get paid in July. Under ACCRUAL, the revenue is recorded in:",options:["July","June","Split evenly","Not recorded"],answer:1,explanation:"Accrual records revenue when EARNED — the work was done in June, so revenue belongs to June."},{q:"Why is depreciation recorded instead of expensing an asset's full cost upfront?",options:["To reduce tax only","To match the cost to the periods that benefit (matching principle)","Because the ATO forbids it","To increase profit"],answer:1,explanation:"The matching principle spreads an asset's cost over its useful life so each period bears its fair share of the cost."},{q:"The straight-line depreciation formula is:",options:["Cost × Useful Life","(Cost − Residual Value) ÷ Useful Life","Cost ÷ Residual Value","Cost − Useful Life"],answer:1,explanation:"Straight-line = (Cost − Residual Value) ÷ Useful Life, giving an equal expense each year."},{q:"A laptop costs $3,000, lasts 3 years, $0 residual. Annual depreciation?",options:["$500","$750","$1,000","$3,000"],answer:2,explanation:"($3,000 − $0) ÷ 3 = $1,000 per year."},{q:"That $3,000 laptop ($1,000/yr). Carrying amount after 1 year?",options:["$3,000","$2,000","$1,000","$0"],answer:1,explanation:"Carrying amount = Cost − Accumulated Depreciation = $3,000 − $1,000 = $2,000."},{q:"The same laptop after 2 years. Carrying amount?",options:["$3,000","$2,000","$1,000","$0"],answer:2,explanation:"$3,000 − ($1,000 × 2) = $1,000."},{q:"'Carrying amount' (book value) equals:",options:["The market resale price","Cost − Accumulated Depreciation","Cost + Depreciation","The original cost"],answer:1,explanation:"Carrying amount = Cost − Accumulated Depreciation. It is a book figure, NOT the asset's market value."},{q:"On which statement does the depreciation EXPENSE appear?",options:["Income Statement","Statement of Cash Flows only","Notes only","It does not appear"],answer:0,explanation:"Depreciation expense reduces profit, so it appears on the Income Statement (Profit & Loss)."},{q:"Where does ACCUMULATED depreciation appear?",options:["Income Statement as revenue","Balance Sheet, reducing the asset's value","Cash Flow Statement as an inflow","Nowhere"],answer:1,explanation:"Accumulated depreciation is a contra-asset on the Balance Sheet — it reduces the asset's carrying amount."},{q:"A machine costs $20,000, residual $2,000, useful life 6 years. Annual depreciation?",options:["$2,000","$3,000","$3,333","$6,000"],answer:1,explanation:"($20,000 − $2,000) ÷ 6 = $18,000 ÷ 6 = $3,000 per year."},{q:"'Residual value' means:",options:["The cost of repairs","The estimated value of the asset at the end of its useful life","The annual depreciation","The purchase price"],answer:1,explanation:"Residual (salvage) value is what you expect the asset to be worth when you finish using it."},{q:"A weakness of the CASH basis is that it:",options:["Is too complicated","Can misrepresent performance by ignoring amounts earned/owed","Is banned worldwide","Always overstates assets"],answer:1,explanation:"Cash basis ignores receivables and payables, so it can give a misleading picture of how the business actually performed."},{q:"Under accrual accounting, an expense is recognised when it is:",options:["Paid in cash","Incurred (the benefit is used), regardless of payment","Budgeted","Approved by the bank"],answer:1,explanation:"Accrual recognises expenses when INCURRED — when the resource/benefit is consumed — not when cash is paid."},{q:"A van costs $50,000, 5-year life, no residual. Annual straight-line depreciation?",options:["$5,000","$10,000","$12,500","$25,000"],answer:1,explanation:"($50,000 − $0) ÷ 5 = $10,000 per year."},{q:"That $50,000 van ($10,000/yr). Carrying amount after 3 years?",options:["$30,000","$20,000","$10,000","$50,000"],answer:1,explanation:"$50,000 − ($10,000 × 3) = $50,000 − $30,000 = $20,000."},{q:"Why is the accrual basis generally preferred over cash basis?",options:["It is simpler","It gives a more accurate picture of performance and matches revenues to expenses","It avoids all estimates","It always shows higher profit"],answer:1,explanation:"Accrual matches revenues with the expenses incurred to earn them, giving a truer view of performance each period."},{q:"Depreciation is described as a ___ expense because no cash leaves the business when it is recorded.",options:["Variable","Non-cash","Prepaid","Financing"],answer:1,explanation:"Depreciation is a NON-CASH expense — the cash left when the asset was bought; depreciation just allocates that cost over time."}],4:[{q:"Which BEST describes an ASSET?",options:["Something the business owes","A resource controlled by the entity, from a past event, with future economic benefits","The owner's personal car","Any item bought this year"],answer:1,explanation:"An asset has three parts: CONTROLLED by the entity, arising from a PAST event, with expected FUTURE economic benefits."},{q:"The recognition criteria require that an item must:",options:["Be listed in AASB only","Meet the definition AND have a probable benefit/outflow that is reliably measurable","Be approved by the board","Be paid in cash"],answer:1,explanation:"Two tests: (1) meet the element DEFINITION, and (2) the future flow is PROBABLE and the amount RELIABLY MEASURABLE."},{q:"EQUITY is best defined as:",options:["Total cash held","Revenue minus expenses","Assets minus Liabilities (the owner's residual interest)","Total borrowings"],answer:2,explanation:"Equity = Assets − Liabilities. It is the owner's RESIDUAL claim on the business after all debts are settled."},{q:"Wages incurred but not yet paid should be recognised as:",options:["An asset","Nothing until paid","A liability (and an expense)","An increase in equity"],answer:2,explanation:"The work is done (expense incurred, reduces equity) and the business owes the money (a liability — wages payable)."},{q:"Highope Ltd spent $300k exploring for platinum (none found, no experience). These costs likely FAIL asset recognition because:",options:["The amount is too small","Future economic benefits are NOT probable","They lack a licence","It was not paid in cash"],answer:1,explanation:"With no platinum found and no experience, future benefits are not PROBABLE — so it fails recognition and is expensed."},{q:"A LIABILITY must involve:",options:["A future benefit flowing IN","A present obligation requiring a future outflow of resources","An asset that lost value","A payment already made"],answer:1,explanation:"A liability is a PRESENT obligation (from a past event) that will require a future sacrifice of economic resources."},{q:"INCOME is defined as:",options:["Any cash received","Increases in equity NOT from owner contributions","Money borrowed from a bank","A reduction in liabilities only"],answer:1,explanation:"Income = increases in economic benefits that raise equity, other than contributions from owners (includes revenue and gains)."},{q:"An EXPENSE is defined as:",options:["Any cash paid out","Decreases in equity NOT from owner drawings","Repaying a loan","Buying an asset"],answer:1,explanation:"Expenses = decreases in economic benefits that reduce equity, other than distributions (drawings/dividends) to owners."},{q:"Which of these is an example of an ASSET?",options:["Accounts payable","Accounts receivable","Bank loan","Unearned revenue"],answer:1,explanation:"Accounts receivable (money customers owe you) is an asset — a future inflow the business controls. The others are liabilities."},{q:"Which of these is an example of a LIABILITY?",options:["Cash","Equipment","Unearned revenue","Inventory"],answer:2,explanation:"Unearned revenue is a liability — you owe the customer goods/services because they paid in advance."},{q:"'Control' of an asset means the entity:",options:["Legally owns the title only","Can direct the use of the resource and obtain its benefits","Has insured it","Bought it with cash"],answer:1,explanation:"Control means the entity has the present ability to direct the resource's use and obtain the economic benefits from it."},{q:"The 'past event' requirement for an asset/liability means:",options:["It will happen next year","The transaction or event has ALREADY occurred","It is only planned","It is in the budget"],answer:1,explanation:"Recognition needs a PAST event that has already happened — future intentions alone do not create assets or liabilities."},{q:"'Probable' in the recognition criteria generally means:",options:["Absolutely certain","More likely than not to occur","Less than 10% likely","Approved by the auditor"],answer:1,explanation:"Probable means the future economic benefit (or outflow) is more likely than not to occur."},{q:"'Reliably measurable' means:",options:["The exact cash is known to the cent","The amount can be determined with a reasonable, faithful estimate","An auditor counted it","It is a round number"],answer:1,explanation:"Reliable measurement allows reasonable estimates — the amount can be faithfully measured, not necessarily to the exact cent."},{q:"If Highope's exploration costs fail asset recognition, they should be:",options:["Ignored","Recognised as an EXPENSE in the current period","Recorded as equity","Recorded as a liability"],answer:1,explanation:"If it does not qualify as an asset (no probable future benefit), the cost is expensed in the period incurred."},{q:"The owner's RESIDUAL interest in the business is called:",options:["Revenue","Equity","A liability","An expense"],answer:1,explanation:"Equity is the residual — what's left for the owner after subtracting all liabilities from all assets."},{q:"Revenue is a sub-category of which element?",options:["Income","Expense","Liability","Equity"],answer:0,explanation:"Income includes both revenue (from ordinary activities) and gains. Revenue is therefore a type of income."},{q:"Owner's drawings should be treated as:",options:["An expense","A reduction in equity (a distribution to the owner)","Revenue","A liability"],answer:1,explanation:"Drawings reduce equity but are NOT an expense — they are a distribution of resources back to the owner."},{q:"A bank loan owed by the business is classified as:",options:["An asset","A liability","Equity","Income"],answer:1,explanation:"A loan is a present obligation to repay in the future — a liability."},{q:"An example of a 'future economic benefit' from an asset is:",options:["A debt that must be repaid","Cash inflows the asset will help generate","A bias in the accounts","A drawing by the owner"],answer:1,explanation:"Future economic benefit = the potential to generate cash inflows or reduce outflows (e.g. equipment producing goods to sell)."}],5:[{q:"A business buys equipment for $8,000 cash. How does the equation change?",options:["Assets +$8,000, Liabilities +$8,000","Total assets unchanged (Cash −$8,000, Equipment +$8,000)","Equity −$8,000","Liabilities −$8,000"],answer:1,explanation:"An ASSET SWAP — cash falls, equipment rises by the same amount. Total assets are unchanged."},{q:"The owner withdraws $500 cash for personal use. The effect is:",options:["Assets +$500, Equity +$500","Assets −$500, Equity −$500","Assets −$500, Liabilities +$500","No effect"],answer:1,explanation:"Drawings reduce assets (cash out) AND equity (owner's stake down). It is not an expense."},{q:"After all 5 sneaker-business transactions, final Owner's Equity is:",options:["$17,000","$15,000","$13,500","$12,000"],answer:0,explanation:"Equity = Capital $15,000 + Revenue $3,000 − Drawings $1,000 = $17,000. Repaying $500 of the payable only touches cash & liabilities, not equity. Check: Assets $18,500 − Liabilities $1,500 = $17,000."},{q:"Why must the accounting equation ALWAYS balance?",options:["It is a legal rule","Every transaction has equal, dual effects (double-entry)","Accountants check it daily","Software forces it"],answer:1,explanation:"Double-entry: every transaction affects at least two accounts in equal and opposite ways, keeping A = L + E in balance."},{q:"The owner invests $15,000 cash to start the business. Effect?",options:["Assets +$15,000, Equity +$15,000","Assets +$15,000, Liabilities +$15,000","Equity −$15,000","No effect"],answer:0,explanation:"A capital contribution increases assets (cash) and equity (owner's capital) by the same amount."},{q:"The business buys $2,000 of supplies ON CREDIT. Effect?",options:["Assets +$2,000, Equity +$2,000","Assets +$2,000, Liabilities +$2,000","Assets −$2,000, Liabilities −$2,000","No effect"],answer:1,explanation:"Supplies (asset) rise $2,000 and accounts payable (liability) rise $2,000 — bought now, pay later."},{q:"The business makes $3,000 of CASH sales. Effect?",options:["Assets +$3,000, Liabilities +$3,000","Assets +$3,000, Equity +$3,000 (revenue)","Assets −$3,000, Equity −$3,000","No effect"],answer:1,explanation:"Cash rises and revenue increases equity. Earning revenue grows the owner's stake."},{q:"The business repays $500 of a loan. Effect?",options:["Assets −$500, Liabilities −$500","Assets −$500, Equity −$500","Assets +$500, Liabilities +$500","No effect"],answer:0,explanation:"Cash (asset) falls $500 and the loan/payable (liability) falls $500. Equity is untouched."},{q:"The accounting equation is:",options:["Assets = Liabilities − Equity","Assets = Liabilities + Equity","Assets + Liabilities = Equity","Equity = Assets + Liabilities"],answer:1,explanation:"Assets = Liabilities + Equity. What the business has equals what it owes plus the owner's stake."},{q:"After all sneaker-business transactions, TOTAL ASSETS equal:",options:["$18,500","$15,000","$13,500","$11,500"],answer:0,explanation:"Cash $11,500 + Equipment $5,000 + Supplies $2,000 = $18,500. Don't forget the $5,000 equipment is still an asset."},{q:"After all transactions, TOTAL LIABILITIES equal:",options:["$2,000","$1,500","$500","$0"],answer:1,explanation:"Supplies were bought on credit for $2,000; $500 was later repaid, leaving accounts payable of $1,500."},{q:"The business pays $800 rent in cash. Effect?",options:["Assets −$800, Equity −$800 (expense)","Assets −$800, Liabilities −$800","Assets +$800, Equity +$800","No effect"],answer:0,explanation:"Rent is an expense — cash falls and equity falls (expenses reduce the owner's stake)."},{q:"The business borrows $10,000 from a bank. Effect?",options:["Assets +$10,000, Equity +$10,000","Assets +$10,000, Liabilities +$10,000","Assets −$10,000, Liabilities +$10,000","No effect"],answer:1,explanation:"Cash (asset) rises $10,000 and the bank loan (liability) rises $10,000."},{q:"The business provides a $1,200 service ON CREDIT. Effect?",options:["Assets +$1,200 (receivable), Equity +$1,200 (revenue)","Assets −$1,200, Equity −$1,200","Liabilities +$1,200","No effect"],answer:0,explanation:"Accounts receivable (asset) rises and revenue increases equity — earned now, cash collected later."},{q:"The business pays a supplier $2,000 it owed. Effect?",options:["Assets −$2,000, Liabilities −$2,000","Assets −$2,000, Equity −$2,000","Assets +$2,000, Liabilities +$2,000","No effect"],answer:0,explanation:"Paying off a payable: cash (asset) down $2,000 and accounts payable (liability) down $2,000."},{q:"Owner's drawings are best described as:",options:["A business expense","A reduction of equity (not an expense)","Revenue","A liability"],answer:1,explanation:"Drawings reduce equity directly — they are the owner taking resources out, not a cost of running the business."},{q:"The business buys a $4,000 computer ON CREDIT. Effect?",options:["Assets +$4,000, Liabilities +$4,000","Assets +$4,000, Equity +$4,000","Assets −$4,000, Liabilities −$4,000","No effect"],answer:0,explanation:"Computer (asset) rises $4,000 and accounts payable (liability) rises $4,000 — total assets and liabilities both increase."},{q:"Earning revenue has what effect on equity?",options:["Decreases it","Increases it","No effect","Turns it into a liability"],answer:1,explanation:"Revenue increases equity — it represents an inflow that grows the owner's residual interest."},{q:"Incurring an expense has what effect on equity?",options:["Increases it","Decreases it","No effect","Increases liabilities only"],answer:1,explanation:"Expenses decrease equity — they consume resources and reduce the owner's stake."},{q:"A customer who owed $600 pays in cash. Effect?",options:["Assets +$600, Equity +$600","Total assets unchanged (Cash +$600, Receivable −$600)","Liabilities −$600","Equity −$600"],answer:1,explanation:"An asset swap — cash rises $600 and accounts receivable falls $600. No new revenue (it was earned earlier)."}],6:[{q:"A business earns $2,000 interest NOT yet received. This is:",options:["Prepaid expense","Accrued revenue","Unearned revenue","Accrued expense"],answer:1,explanation:"Accrued revenue = earned but cash not yet received. Recognise the revenue now and record a receivable."},{q:"The business owes $3,500 wages (work done, unpaid). Effect on the equation?",options:["Assets ↓, Equity ↓","Liabilities ↑, Equity ↓ (expense)","Assets ↑, Liabilities ↑","No effect until paid"],answer:1,explanation:"Accrued expense: recognise the expense now (equity ↓) and a wages-payable liability (liabilities ↑)."},{q:"$1,200 insurance is paid covering the NEXT 6 months. Initially recorded as:",options:["Insurance expense","Prepaid insurance (an asset)","Unearned insurance","Accrued insurance"],answer:1,explanation:"Paid in advance for a future benefit = a prepaid expense (asset). It becomes expense as the months pass."},{q:"A customer prepays $2,500 for services delivered NEXT period. This creates:",options:["Revenue now","An asset","A liability (unearned revenue)","An expense"],answer:2,explanation:"Cash received but service not delivered = unearned revenue, a liability. Revenue is recognised only when earned."},{q:"$900 electricity is incurred but NOT yet paid. The adjustment will:",options:["Increase assets and equity","Decrease assets","Increase liabilities and decrease equity (expense)","Have no effect"],answer:2,explanation:"Accrued expense: electricity used now → expense (equity ↓) and a payable (liabilities ↑)."},{q:"The PURPOSE of balance day adjustments is to:",options:["Increase profit","Ensure revenues and expenses are recorded in the correct period (accrual)","Reduce tax","Balance the bank account"],answer:1,explanation:"They align the records with accrual accounting — matching revenues and expenses to the period they belong to."},{q:"Accrued REVENUE has what effect on the equation?",options:["Asset ↑, Equity ↑ (revenue)","Liability ↑, Equity ↓","Asset ↓, Equity ↓","No effect"],answer:0,explanation:"Earned but not received: a receivable asset rises and revenue increases equity."},{q:"Accrued EXPENSE has what effect on the equation?",options:["Asset ↑, Equity ↑","Liability ↑, Equity ↓ (expense)","Asset ↓, Liability ↓","No effect"],answer:1,explanation:"Incurred but not paid: a payable liability rises and the expense reduces equity."},{q:"A PREPAID expense is initially recorded as a(n):",options:["Liability","Asset","Expense","Revenue"],answer:1,explanation:"Prepayments are future benefits paid for in advance — an asset until the benefit is consumed."},{q:"UNEARNED revenue is classified as a(n):",options:["Asset","Liability","Expense","Equity"],answer:1,explanation:"Cash received before earning it creates an obligation to deliver — a liability until the service is performed."},{q:"Rent received in advance from a tenant is:",options:["Accrued revenue","Unearned revenue (a liability)","A prepaid expense","An asset"],answer:1,explanation:"You received cash but haven't yet provided the rental period — it's unearned revenue, a liability."},{q:"At period end, supplies on hand have fallen because some were used. The adjustment is:",options:["Asset ↑, Equity ↑","Asset ↓ (supplies), Equity ↓ (supplies expense)","Liability ↑","No effect"],answer:1,explanation:"Used supplies become an expense: the supplies asset falls and equity falls via supplies expense."},{q:"Recording depreciation at balance day:",options:["Increases the asset's value","Decreases the asset's carrying amount and decreases equity (expense)","Is a financing activity","Has no effect on equity"],answer:1,explanation:"Depreciation is a balance day adjustment: accumulated depreciation reduces the asset and the expense reduces equity."},{q:"$3,000 of service income is earned but NOT yet invoiced. This is:",options:["Unearned revenue","Accrued revenue","A prepaid expense","An accrued expense"],answer:1,explanation:"Earned (service performed) but not yet billed/received = accrued revenue. Recognise revenue and a receivable."},{q:"As prepaid advertising is gradually USED UP, the adjustment is:",options:["Asset ↑, Equity ↑","Asset ↓, Equity ↓ (advertising expense)","Liability ↑","No effect"],answer:1,explanation:"The prepaid asset is consumed: it falls and advertising expense is recognised, reducing equity."},{q:"Interest owed on a loan but not yet paid is a(n):",options:["Prepaid expense","Accrued expense","Unearned revenue","Asset"],answer:1,explanation:"Interest has accrued (been incurred) but isn't paid yet — an accrued expense with a matching liability."},{q:"Which adjustment type creates a LIABILITY when cash is first received?",options:["Accrued revenue","Prepaid expense","Unearned revenue","Depreciation"],answer:2,explanation:"Unearned revenue: receiving cash before delivering creates a liability (an obligation to perform)."},{q:"When previously unearned revenue is finally EARNED, the effect is:",options:["Liability ↓, Equity ↑ (revenue)","Asset ↑, Liability ↑","Equity ↓","No effect"],answer:0,explanation:"Once the service is delivered, the liability is reduced and revenue is recognised (equity ↑)."},{q:"Balance day adjustments are made:",options:["At the start of the period","At the END of the reporting period","Every time cash moves","Only when audited"],answer:1,explanation:"They are end-of-period entries that bring the accounts up to date before preparing the financial statements."},{q:"If a business FAILS to record an accrued expense, profit will be:",options:["Understated","Overstated","Unaffected","Negative"],answer:1,explanation:"Missing an expense means expenses are too low, so profit is OVERSTATED (and liabilities understated)."}],7:[{q:"Received $15,000 from a customer for goods sold. Cash flow classification?",options:["Investing","Financing","Operating","Not included"],answer:2,explanation:"Collecting from customers is core day-to-day trading — an OPERATING cash inflow."},{q:"Purchased new machinery for $80,000 cash. Classification?",options:["Operating","Investing","Financing","Non-cash"],answer:1,explanation:"Buying long-term assets is an INVESTING activity."},{q:"Repaid $20,000 of a bank loan. Classification?",options:["Operating","Investing","Financing","Both O and F"],answer:2,explanation:"Repaying borrowings relates to how the business is funded — a FINANCING activity."},{q:"Why is POSITIVE operating cash flow so important?",options:["It means assets were bought","It shows the core business generates real cash, not just paper profit","It means borrowings rose","It proves profit is high"],answer:1,explanation:"A business can be profitable on paper yet run out of cash. Positive operating cash flow shows genuine, sustainable health."},{q:"Paid a $5,000 dividend to shareholders. Classification?",options:["Operating","Investing","Financing","Expense"],answer:2,explanation:"Dividends are a return to equity providers — a FINANCING outflow."},{q:"Paid a supplier for inventory. Classification?",options:["Operating","Investing","Financing","Non-cash"],answer:0,explanation:"Paying for trading stock is a core operating activity — OPERATING."},{q:"Issued shares for cash. Classification?",options:["Operating","Investing","Financing","Non-cash"],answer:2,explanation:"Raising equity capital from owners is a FINANCING activity."},{q:"Sold an old delivery van for cash. Classification?",options:["Operating","Investing","Financing","Expense"],answer:1,explanation:"Disposing of a long-term asset is an INVESTING activity (an inflow this time)."},{q:"Paid wages to staff. Classification?",options:["Operating","Investing","Financing","Non-cash"],answer:0,explanation:"Payroll is a day-to-day operating cost — OPERATING."},{q:"Paid interest on a loan (under AASB). Classification?",options:["Operating","Investing","Financing","Equity"],answer:0,explanation:"Under AASB, interest PAID is typically classified as an OPERATING cash flow (a cost of doing business)."},{q:"The Income Statement is calculated as:",options:["Assets − Liabilities","Revenue − Expenses = Net Profit","Cash in − Cash out","Equity + Liabilities"],answer:1,explanation:"The Income Statement (P&L) shows Revenue − Expenses = Net Profit over a period."},{q:"The Balance Sheet is built on which equation?",options:["Revenue − Expenses","Assets = Liabilities + Equity","Cash = Profit","O + I + F"],answer:1,explanation:"The Balance Sheet (Statement of Financial Position) shows Assets = Liabilities + Equity at a point in time."},{q:"The Statement of Cash Flows has which three sections?",options:["Assets, Liabilities, Equity","Operating, Investing, Financing","Revenue, Expenses, Profit","Past, Present, Future"],answer:1,explanation:"Cash flows are grouped into Operating, Investing and Financing activities."},{q:"Buying a new building is classified as:",options:["Operating","Investing","Financing","Non-cash"],answer:1,explanation:"Acquiring a long-term (non-current) asset is an INVESTING activity."},{q:"Received a cash refund from an equipment supplier. Classification?",options:["Operating","Investing","Financing","Equity"],answer:1,explanation:"The refund relates to the equipment (an asset) purchase, so it's an INVESTING cash flow."},{q:"Borrowed money from the bank. Classification?",options:["Operating","Investing","Financing","Non-cash"],answer:2,explanation:"Taking out a new loan is raising debt finance — a FINANCING inflow."},{q:"Which statement reports financial position at a single POINT IN TIME?",options:["Income Statement","Balance Sheet","Cash Flow Statement","Budget"],answer:1,explanation:"The Balance Sheet is a snapshot at a point in time. The others cover a period."},{q:"Which statement reports PROFITABILITY over a period?",options:["Income Statement","Balance Sheet","Statement of changes in cash","Trial balance"],answer:0,explanation:"The Income Statement shows revenue and expenses across a period to arrive at net profit."},{q:"A profitable business can still have NEGATIVE operating cash flow mainly because:",options:["It paid too much tax","Customers haven't paid yet (sales on credit) or stock was built up","It issued shares","It bought a building"],answer:1,explanation:"Profit is on an accrual basis. If credit customers haven't paid, profit can be positive while operating cash is negative."},{q:"Owner's drawings (or dividends) appear in which cash flow section?",options:["Operating","Investing","Financing","They are never cash"],answer:2,explanation:"Distributions to owners (drawings/dividends) are FINANCING cash outflows."}],8:[{q:"Contribution margin (CM) per unit is calculated as:",options:["Revenue − Fixed Costs","Selling Price − Variable Cost per unit","Net Profit ÷ Units","Total Revenue ÷ Total Costs"],answer:1,explanation:"CM = Selling Price − Variable Cost. It's what each unit contributes towards fixed costs and then profit."},{q:"A café: Fixed costs $4,000/month, CM $8/unit. Break-even in UNITS?",options:["200","400","500","1,000"],answer:2,explanation:"Break-even = Fixed Costs ÷ CM = $4,000 ÷ $8 = 500 units."},{q:"If price drops $12 → $10 (variable cost $4 unchanged), break-even:",options:["Decreases — easier","Stays the same","Increases — need to sell more","Cannot be determined"],answer:2,explanation:"CM falls from $8 to $6, so break-even rises from 500 to ~667 units. Lower price = more risk."},{q:"Target profit $2,000, CM $8, Fixed $4,000. Units required?",options:["500","625","750","1,000"],answer:2,explanation:"(Fixed + Target) ÷ CM = ($4,000 + $2,000) ÷ $8 = 750 units."},{q:"Contribution margin first goes towards covering:",options:["Variable costs","Fixed costs (then profit)","Tax","Dividends"],answer:1,explanation:"Each unit's CM covers fixed costs first; once fixed costs are covered, additional CM becomes profit."},{q:"Break-even in DOLLARS for the café (500 units × $12)?",options:["$4,000","$5,000","$6,000","$8,000"],answer:2,explanation:"Break-even dollars = break-even units × price = 500 × $12 = $6,000."},{q:"CM ratio for price $12 and CM $8 is:",options:["33.3%","50%","66.7%","75%"],answer:2,explanation:"CM ratio = CM ÷ Price = $8 ÷ $12 = 0.667 = 66.7%."},{q:"At a price of $10 and variable cost $4, the new CM is:",options:["$4","$6","$8","$10"],answer:1,explanation:"CM = $10 − $4 = $6 per unit."},{q:"With CM $6 and fixed costs $4,000, break-even units (rounded up) is:",options:["500","600","667","750"],answer:2,explanation:"$4,000 ÷ $6 = 666.7, rounded up to 667 units."},{q:"FIXED costs are best described as costs that:",options:["Change with each unit sold","Stay the same in total regardless of volume","Only occur once","Equal the selling price"],answer:1,explanation:"Fixed costs (e.g. rent) stay constant in total no matter how many units you make or sell."},{q:"VARIABLE costs are costs that:",options:["Stay constant in total","Change in total as volume changes","Are paid annually","Never change per unit"],answer:1,explanation:"Variable costs (e.g. ingredients) change in total with output — more units, more total variable cost."},{q:"If FIXED costs rise (everything else equal), break-even point:",options:["Falls","Rises","Stays the same","Becomes zero"],answer:1,explanation:"Higher fixed costs mean more units are needed to cover them — break-even rises."},{q:"A HIGHER contribution margin per unit generally means:",options:["A higher break-even point","A lower break-even point (less risk)","No effect on break-even","Higher fixed costs"],answer:1,explanation:"More CM per unit covers fixed costs faster, lowering break-even — less risk."},{q:"Target profit $3,000, CM $8, Fixed $4,000. Units needed?",options:["750","800","875","1,000"],answer:2,explanation:"($4,000 + $3,000) ÷ $8 = $7,000 ÷ $8 = 875 units."},{q:"Break-even in dollars can also be found as:",options:["Fixed Costs ÷ CM ratio","Fixed Costs × CM","Variable Costs ÷ Price","Price × Units"],answer:0,explanation:"Break-even $ = Fixed Costs ÷ CM ratio (an alternative to break-even units × price)."},{q:"Selling MORE units than the break-even point results in:",options:["A loss","A profit","Exactly zero","Higher fixed costs"],answer:1,explanation:"Beyond break-even, each extra unit's full CM becomes profit."},{q:"Price $15, variable cost $5. Contribution margin per unit?",options:["$5","$10","$15","$20"],answer:1,explanation:"CM = $15 − $5 = $10 per unit."},{q:"Fixed costs $6,000, CM $10/unit. Break-even units?",options:["400","500","600","1,000"],answer:2,explanation:"$6,000 ÷ $10 = 600 units."},{q:"'Margin of safety' refers to:",options:["Fixed costs ÷ CM","How far actual sales are ABOVE the break-even point","The variable cost per unit","The CM ratio"],answer:1,explanation:"Margin of safety = the cushion between actual (or budgeted) sales and break-even — how much sales can drop before a loss."},{q:"CVP analysis is MOST useful for helping managers decide:",options:["The colour of the logo","Pricing and cost strategies (e.g. effect of a price cut)","Who to hire as auditor","The company's legal structure"],answer:1,explanation:"CVP shows how price, costs and volume interact, guiding pricing, cost-cutting and promotion decisions."}],9:[{q:"Alpha: Operating Profit $400,000, Investment $2,500,000. ROI?",options:["12%","14%","16%","20%"],answer:2,explanation:"ROI = Profit ÷ Investment = $400,000 ÷ $2,500,000 = 16%."},{q:"Beta: Profit $280,000, Investment $1,600,000, Required rate 12%. Residual Income?",options:["$88,000","$192,000","$280,000","−$88,000"],answer:0,explanation:"RI = Profit − (Investment × Rate) = $280,000 − ($1,600,000 × 12%) = $280,000 − $192,000 = $88,000."},{q:"Which division has the HIGHER ROI?",options:["Alpha (16%)","Beta (17.5%)","They are equal","Cannot tell"],answer:1,explanation:"Beta ROI = $280,000 ÷ $1,600,000 = 17.5% > Alpha's 16%."},{q:"A manager evaluated ONLY on ROI might dysfunctionally:",options:["Accept every profitable project","Reject a project that beats the required rate but lowers their division's ROI","Always maximise firm value","Focus on the long term"],answer:1,explanation:"If a project returns less than the manager's current ROI (but more than the required rate), they may reject it — hurting the firm. RI fixes this."},{q:"The ROI formula is:",options:["Profit − Investment","Operating Profit ÷ Total Investment × 100","Investment ÷ Profit","Profit × Required Rate"],answer:1,explanation:"ROI = Operating Profit ÷ Total Investment, expressed as a percentage."},{q:"The Residual Income formula is:",options:["Profit ÷ Investment","Operating Profit − (Investment × Required Rate)","Investment × ROI","Profit + Required Return"],answer:1,explanation:"RI = Operating Profit − (Investment × Required Rate of Return). It's profit above the minimum required."},{q:"Alpha: Profit $400,000, Investment $2,500,000, Required rate 10%. Residual Income?",options:["$100,000","$150,000","$250,000","$400,000"],answer:1,explanation:"RI = $400,000 − ($2,500,000 × 10%) = $400,000 − $250,000 = $150,000."},{q:"A positive Residual Income (RI > 0) means the division:",options:["Lost money","Earned MORE than its minimum required return (created value)","Has high ROI","Should be closed"],answer:1,explanation:"Positive RI means the division beat the required return in dollar terms — it created value for the firm."},{q:"Based on RI, which division creates MORE value above expectations?",options:["Alpha ($150,000)","Beta ($88,000)","They are equal","Neither"],answer:0,explanation:"Alpha's RI ($150,000) exceeds Beta's ($88,000), so Alpha adds more absolute value."},{q:"Beta's ROI is calculated as:",options:["$280,000 ÷ $1,600,000 = 17.5%","$280,000 ÷ $400,000 = 70%","$1,600,000 ÷ $280,000","$280,000 × 12%"],answer:0,explanation:"ROI = Profit ÷ Investment = $280,000 ÷ $1,600,000 = 17.5%."},{q:"A key ADVANTAGE of ROI is that it:",options:["Always grows the firm","Is a simple % that allows comparison across divisions of different sizes","Ignores investment","Guarantees goal congruence"],answer:1,explanation:"ROI is an easy-to-understand ratio, useful for comparing divisions of different sizes on a like-for-like basis."},{q:"A key LIMITATION of ROI is that it:",options:["Is too hard to calculate","Can encourage dysfunctional/short-term decisions (rejecting value-adding projects)","Ignores profit","Cannot be a percentage"],answer:1,explanation:"ROI can lead managers to reject good investments that would lower their average ROI — even if they add value."},{q:"A key ADVANTAGE of Residual Income is that it:",options:["Is always higher than ROI","Promotes goal congruence — managers accept all projects above the required return","Ignores the cost of capital","Is a percentage"],answer:1,explanation:"RI encourages accepting ANY project with a positive RI, aligning manager decisions with the firm's interests."},{q:"A key LIMITATION of Residual Income is that it:",options:["Is a percentage","Is an absolute $ figure, making comparison between different-sized divisions harder","Ignores profit","Cannot be negative"],answer:1,explanation:"Because RI is a dollar amount, a large division will naturally show a bigger RI — making cross-size comparison unfair."},{q:"The 'required rate of return' is also known as the:",options:["Profit margin","Cost of capital / hurdle rate","Asset turnover","Break-even rate"],answer:1,explanation:"The required rate is the minimum acceptable return — the cost of capital or hurdle rate for investments."},{q:"A division earns Profit $100,000 on Investment $500,000. ROI?",options:["10%","15%","20%","25%"],answer:2,explanation:"ROI = $100,000 ÷ $500,000 = 20%."},{q:"That division: Profit $100,000, Investment $500,000, Required rate 15%. RI?",options:["$15,000","$25,000","$75,000","$100,000"],answer:1,explanation:"RI = $100,000 − ($500,000 × 15%) = $100,000 − $75,000 = $25,000."},{q:"If a division's Residual Income is NEGATIVE, it means the division:",options:["Made no profit at all","Earned LESS than the required return","Has a high ROI","Should expand"],answer:1,explanation:"Negative RI means profit did not cover the required return on investment — it destroyed value relative to the hurdle."},{q:"A manager whose bonus depends on ROI may be tempted to:",options:["Over-invest in everything","Under-invest / avoid projects that dilute their ROI","Ignore profit","Increase the required rate"],answer:1,explanation:"To protect a high ROI, the manager may avoid worthwhile projects that would lower the average — classic dysfunctional behaviour."},{q:"For comparing the performance of divisions of DIFFERENT sizes, the better measure is usually:",options:["Residual Income (absolute $)","ROI (a percentage)","Total assets","Net profit alone"],answer:1,explanation:"ROI's percentage form makes it fairer for comparing divisions of different sizes; RI favours larger divisions."}],10:[{q:"Pine Ltd: Sales $3,000,000, Net Profit $240,000. Profit margin?",options:["5%","8%","12.5%","20%"],answer:1,explanation:"Profit Margin = Net Profit ÷ Sales = $240,000 ÷ $3,000,000 = 8%."},{q:"Pine Ltd: Sales $3,000,000, Avg Total Assets $1,200,000. Asset turnover?",options:["1.5×","2.0×","2.5×","4.0×"],answer:2,explanation:"Asset Turnover = Sales ÷ Avg Total Assets = $3,000,000 ÷ $1,200,000 = 2.5 times."},{q:"Using DuPont, Pine Ltd's ROA = Profit Margin × Asset Turnover =",options:["10%","15%","20%","25%"],answer:2,explanation:"ROA = 8% × 2.5 = 20%. Check: $240,000 ÷ $1,200,000 = 20%."},{q:"To improve ROA via ASSET TURNOVER, the best strategy is:",options:["Cut advertising (improves margin)","Generate more sales from the same asset base","Increase borrowings","Lower prices permanently"],answer:1,explanation:"Asset turnover improves when you squeeze more sales out of existing assets — e.g. better inventory or receivables management."},{q:"The Profit Margin formula is:",options:["Sales ÷ Net Profit","Net Profit ÷ Sales × 100","Net Profit ÷ Assets","Sales ÷ Assets"],answer:1,explanation:"Profit Margin = Net Profit ÷ Sales × 100 — cents of profit per dollar of sales."},{q:"The Asset Turnover formula is:",options:["Net Profit ÷ Sales","Sales ÷ Average Total Assets","Assets ÷ Sales","Sales ÷ Equity"],answer:1,explanation:"Asset Turnover = Sales ÷ Average Total Assets — how efficiently assets generate sales."},{q:"Return on Assets (ROA) is calculated as:",options:["Net Profit ÷ Average Total Assets × 100","Sales ÷ Assets","Profit ÷ Equity","Assets − Liabilities"],answer:0,explanation:"ROA = Net Profit ÷ Average Total Assets × 100 — return generated per dollar of assets."},{q:"The DuPont formula expresses ROA as:",options:["Profit Margin + Asset Turnover","Profit Margin × Asset Turnover","Profit Margin ÷ Asset Turnover","Sales × Profit"],answer:1,explanation:"DuPont: ROA = Profit Margin × Asset Turnover — splitting ROA into profitability and efficiency."},{q:"Return on Equity (ROE) is calculated as:",options:["Net Profit ÷ Owner's Equity × 100","Net Profit ÷ Sales","Sales ÷ Equity","Assets ÷ Equity"],answer:0,explanation:"ROE = Net Profit ÷ Owner's Equity × 100 — the return generated on the owners' investment."},{q:"Gross Profit Margin is calculated as:",options:["Net Profit ÷ Sales","Gross Profit ÷ Sales × 100","Sales ÷ Gross Profit","Gross Profit ÷ Assets"],answer:1,explanation:"Gross Profit Margin = Gross Profit ÷ Sales × 100 — profitability before operating expenses."},{q:"A company has Net Profit $50,000 and Sales $500,000. Profit margin?",options:["5%","10%","15%","20%"],answer:1,explanation:"$50,000 ÷ $500,000 = 10%."},{q:"Sales $1,000,000 and Average Total Assets $500,000. Asset turnover?",options:["1.0×","2.0×","2.5×","5.0×"],answer:1,explanation:"$1,000,000 ÷ $500,000 = 2.0 times."},{q:"If profit margin is 10% and asset turnover is 2.0×, ROA (DuPont) is:",options:["12%","20%","5%","0.2%"],answer:1,explanation:"ROA = 10% × 2.0 = 20%."},{q:"To improve ROA via PROFIT MARGIN, a business could:",options:["Buy more assets","Cut costs or raise selling prices","Take on more debt","Sell more on credit"],answer:1,explanation:"Profit margin improves when you earn more profit per sale — by reducing costs or increasing prices."},{q:"A HIGH asset turnover suggests the business:",options:["Wastes its assets","Uses its assets efficiently to generate sales","Has too much debt","Has low sales"],answer:1,explanation:"High asset turnover = lots of sales per dollar of assets, indicating efficient asset use."},{q:"ROA tells you the return earned on every dollar of:",options:["Sales","Assets","Equity","Liabilities"],answer:1,explanation:"ROA measures profit relative to total assets — the return per dollar of assets employed."},{q:"ROE tells you the return earned for the:",options:["Customers","Owners/shareholders","Lenders","Suppliers"],answer:1,explanation:"ROE measures profit relative to equity — the return generated for the owners' investment."},{q:"If profit margin RISES while asset turnover stays constant, ROA will:",options:["Fall","Rise","Stay the same","Become zero"],answer:1,explanation:"ROA = margin × turnover. Holding turnover constant, a higher margin raises ROA."},{q:"Profit margin essentially tells you:",options:["How many assets you own","Cents of profit earned per dollar of sales","How fast inventory sells","Total borrowings"],answer:1,explanation:"Profit margin = profit per dollar of sales — the proportion of each sales dollar kept as profit."},{q:"A LOW asset turnover could indicate:",options:["Highly efficient assets","Underused or excess assets relative to sales","Very high sales","No fixed costs"],answer:1,explanation:"Low turnover means few sales per dollar of assets — possibly idle, excess, or underutilised assets."}]},df={1:[{q:"Which statement about a company (Pty Ltd) is correct?",options:["Owners have unlimited liability","It is not a separate legal entity","Shareholders' liability is limited to their investment","It cannot own assets in its own name"],answer:2,difficulty:"hard",explanation:"A company is a separate legal entity; shareholders only risk the capital they invested — that is limited liability."},{q:"Which feature distinguishes a PUBLIC company (Ltd) from a PROPRIETARY company (Pty Ltd)?",options:["Only a public company has limited liability","A public company can sell its shares to the public; a Pty Ltd cannot","A Pty Ltd is a separate legal entity but a public company is not","Only a Pty Ltd must follow the Corporations Act"],answer:1,difficulty:"hard",explanation:"Public (Ltd) companies can raise money by selling shares to the public and face extensive regulation; proprietary (Pty Ltd) companies cannot sell to the public and are more lightly regulated."},{q:"In Australia, the primary law governing companies is the Corporations Act, enforced by:",options:["The ATO","ASIC","The RBA","The ASX"],answer:1,explanation:"ASIC (Australian Securities and Investments Commission) administers the Corporations Act. The ATO handles tax, the RBA monetary policy, and the ASX is the share market."},{q:"Explain the key difference between financial and management accounting in terms of audience and regulation.",type:"short",answer:"Financial accounting reports to EXTERNAL users (investors, banks, ATO) and must follow AASB standards; management accounting is for INTERNAL decision-makers, is flexible/forward-looking and follows no mandatory format.",explanation:"Audience (external vs internal) and regulation (standardised vs flexible) are the two defining contrasts."},{q:"Exam Q1 scenario: a small partnership is considering EXPANSION. Which form of accounting is most useful, and why?",type:"short",answer:"MANAGEMENT accounting. It supplies internal, forward-looking information — budgets, cash-flow forecasts, cost-volume-profit and break-even analysis — that lets the partners test whether the expansion is affordable and worthwhile before committing.",explanation:"The decision is an internal, future-oriented one, so management accounting (not the historical, external financial accounts) is the right tool."}],2:[{q:"Name the two FUNDAMENTAL qualitative characteristics and the four ENHANCING ones.",type:"short",answer:"Fundamental: Relevance and Faithful Representation. Enhancing: Comparability, Verifiability, Timeliness, Understandability.",explanation:"Fundamentals come first; the four enhancing characteristics improve usefulness but cannot replace them."},{q:"A company sits on its annual report for 8 months before releasing it. Which ENHANCING characteristic is most compromised?",options:["Comparability","Verifiability","Timeliness","Understandability"],answer:2,difficulty:"hard",explanation:"Information must be available in time to influence decisions. An 8-month delay damages TIMELINESS."}],3:[{q:"Harry's Variety Store buys a laptop for $3,000 (1 Jan 2023) with a 3-year life and no residual value. What is the annual straight-line depreciation ($)?",type:"calc",answer:1e3,tolerance:.5,difficulty:"hard",explanation:"(Cost − Residual) / Useful life = ($3,000 − $0) / 3 = $1,000 per year."},{q:"Harry's laptop ($3,000, $1,000/yr). What is its CARRYING AMOUNT at the end of year 2 ($)?",type:"calc",answer:1e3,tolerance:.5,explanation:"Carrying amount = Cost − Accumulated Depreciation = $3,000 − ($1,000 × 2) = $1,000."},{q:"REDUCING-BALANCE method: a computer costs $10,000 and is depreciated at 30% on the reducing balance. What is the depreciation expense in YEAR 1 ($)?",type:"calc",answer:3e3,tolerance:.5,difficulty:"hard",explanation:"Year 1 = (Cost − Accumulated Depreciation) × Rate = ($10,000 − $0) × 30% = $3,000."},{q:"Same computer ($10,000, 30% reducing-balance). What is the depreciation expense in YEAR 2 ($)?",type:"calc",answer:2100,tolerance:.5,difficulty:"hard",explanation:"Year 2 = (Cost − Accumulated Depreciation) × Rate = ($10,000 − $3,000) × 30% = $7,000 × 30% = $2,100. Notice it's LESS than year 1 — reducing-balance front-loads depreciation."},{q:"UNITS-OF-PRODUCTION: a machine costs $50,000, residual $5,000, and is expected to produce 90,000 units over its life. It makes 18,000 units this year. Depreciation for the year ($)?",type:"calc",answer:9e3,tolerance:.5,difficulty:"hard",explanation:"[(Cost − Residual) / total units] × units used = [($50,000 − $5,000) / 90,000] × 18,000 = $0.50 × 18,000 = $9,000."},{q:"A business performs $5,000 of work in June but the customer pays in July. Under the ACCRUAL basis, in which month is the revenue recognised?",options:["July, when cash is received","June, when the work is performed","Split between June and July","Neither — wait for year end"],answer:1,difficulty:"hard",explanation:"Accrual recognises revenue when EARNED (work performed) — June — regardless of when the cash arrives."},{q:"Amortisation is to intangible assets as depreciation is to:",options:["Current assets","Tangible (physical) assets","Liabilities","Cash"],answer:1,explanation:"Depreciation allocates the cost of TANGIBLE assets; amortisation does the same job for INTANGIBLE assets (e.g. patents, software)."}],4:[{q:"State the two recognition criteria that must be met to record an asset under the Conceptual Framework (as taught in this course).",type:"short",answer:"It must meet the DEFINITION of an asset, and recognition must provide USEFUL information — i.e. the information is RELEVANT and a FAITHFUL REPRESENTATION (complete, neutral, free from error).",explanation:"The course frames recognition through relevance + faithful representation (older texts say 'probable + reliably measurable')."},{q:"List the THREE criteria an item must ALL meet to be an asset.",type:"short",answer:"(1) A present economic resource (has the potential to produce future economic benefits), (2) Controlled by the entity, (3) Arising as a result of a past event.",explanation:"All three — resource + control + past event — must be satisfied."},{q:"Exam Q2 (Highope Ltd): $300,000 was spent exploring for platinum — a mining licence is held, but there is no experience and no platinum found. Do these costs qualify as an ASSET? Justify and state the correct treatment.",type:"short",answer:"No. There is no reliable evidence of future economic benefits — no platinum found and no mining experience — so recognising an asset would not be relevant or a faithful representation. The costs should be recognised as an EXPENSE in the period incurred.",explanation:"Control + past event are arguable, but the uncertain future benefit means asset recognition fails → expense it."},{q:"Highope Ltd's exploration costs fail asset recognition mainly because:",options:["The $300,000 is immaterial","Future economic benefits are not reliably demonstrated (no platinum found, no experience)","They lack a mining licence","The cash has not yet been paid"],answer:1,difficulty:"hard",explanation:"Recognising the costs as an asset would not faithfully represent the situation when recovery is unproven → expense."}],5:[{q:"Sneaker business: owner invests $15,000; buys $5,000 equipment (cash); buys $2,000 supplies on credit; earns $3,000 cash sales; repays $500 of the payable; withdraws $1,000. What are TOTAL ASSETS at the end ($)?",type:"calc",answer:18500,tolerance:.5,difficulty:"hard",explanation:"Cash $11,500 (15,000 − 5,000 + 3,000 − 500 − 1,000) + Equipment $5,000 + Supplies $2,000 = $18,500."},{q:"Same sneaker business. What is the final OWNER'S EQUITY ($)?",type:"calc",answer:17e3,tolerance:.5,difficulty:"hard",explanation:"Equity = Capital $15,000 + Revenue $3,000 − Drawings $1,000 = $17,000. Check: Assets $18,500 − Liabilities $1,500 = $17,000."},{q:"In the sneaker business, buying $2,000 of supplies ON CREDIT affects the accounting equation how?",type:"short",answer:"Assets increase (Supplies +$2,000) and Liabilities increase (Accounts Payable +$2,000); Equity is unchanged. The equation stays balanced.",explanation:"Buying on credit raises an asset and a liability by the same amount — equity is untouched."}],6:[{q:"Exam Q5 item: $1,200 insurance is paid covering the next 6 months. After 2 months have passed, how much insurance EXPENSE has been recognised ($)?",type:"calc",answer:400,tolerance:.5,difficulty:"hard",explanation:"$1,200 / 6 months = $200 per month × 2 months = $400 expensed."},{q:"Same $1,200 insurance (6 months). After 2 months, how much remains as PREPAID insurance (an asset) ($)?",type:"calc",answer:800,tolerance:.5,explanation:"$1,200 − $400 used = $800 still prepaid (an asset) at that point."},{q:"Exam Q5 item: a customer prepays $4,000 in advance for services to be delivered next period. At balance day this is:",options:["Revenue recognised immediately","An accrued revenue (asset)","Unearned revenue (a liability)","A prepaid expense (an asset)"],answer:2,difficulty:"hard",explanation:"Cash received before the service is delivered → unearned (prepaid) revenue, a LIABILITY, until the service is performed."},{q:"Which method of accounting for bad debts is PREFERRED under the accrual concept, and why?",options:["Direct write-off — it only records a loss once a debt is confirmed bad","The allowance method — it estimates bad debts in the period of the sale, matching expense to revenue","Neither — bad debts are never recorded","Direct write-off — because it avoids estimates"],answer:1,difficulty:"hard",explanation:"The allowance method estimates uncollectible debts and records the expense in the SAME period as the sale, satisfying the matching principle. Direct write-off often records the loss in a later period."},{q:"Under the DIRECT WRITE-OFF method, when a specific debt becomes uncollectible the entry is:",options:["Accounts Receivable ↓ and Bad Debts Expense ↑","Cash ↑ and Revenue ↑","Allowance for Doubtful Debts ↓ only","No entry is made"],answer:0,explanation:"Direct write-off removes the receivable (Asset ↓) and recognises a Bad Debts Expense (Equity ↓) when the debt is confirmed bad."}],7:[{q:"From the exam Q6 list, which transaction is an INVESTING activity?",options:["Paid wages","Sold an old delivery van","Issued shares for cash","Paid interest on a loan"],answer:1,difficulty:"hard",explanation:"Selling a long-term (non-current) asset like a delivery van is an INVESTING activity. Wages & interest are operating; issuing shares is financing."},{q:"Exam Q6 trap: under AASB, 'paid interest on a loan' is normally classified as which cash-flow activity?",options:["Financing","Investing","Operating","It is non-cash"],answer:2,difficulty:"hard",explanation:"Interest PAID is treated as an OPERATING cash flow (a cost of running the business) under AASB — a common exam catch."},{q:"Which of the FOUR financial statements bridges the Income Statement to the Balance Sheet by showing Opening Equity + Profit − Drawings?",options:["Statement of Cash Flows","Statement of Changes in Owner's Equity","Statement of Financial Position","Statement of Profit or Loss"],answer:1,difficulty:"hard",explanation:"The Statement of Changes in Owner's Equity reconciles profit into the closing equity figure that appears on the Balance Sheet."},{q:"Sales $500,000 and Cost of Sales $275,000. What is GROSS PROFIT ($)?",type:"calc",answer:225e3,tolerance:.5,explanation:"Gross Profit = Sales − Cost of Sales = $500,000 − $275,000 = $225,000."},{q:"Exam Q6 asks how the three activity types help users. Briefly explain what Operating, Investing and Financing cash flows each tell a user.",type:"short",answer:"OPERATING shows whether core trading generates enough cash to sustain the business. INVESTING shows whether the business is growing or shrinking its asset base (buying vs selling non-current assets). FINANCING shows how the business is funded — raising/repaying debt and equity and returns to owners.",explanation:"O = sustainability of the core business; I = investment in capacity; F = funding and returns to capital providers."}],8:[{q:"Café toasties: price $12, variable cost $4, fixed costs $4,000/month. What is the break-even point in UNITS?",type:"calc",answer:500,tolerance:.5,difficulty:"hard",explanation:"CM = $12 − $4 = $8. Break-even = Fixed / CM = $4,000 / $8 = 500 toasties."},{q:"Same café ($12 / $4 / $4,000 fixed). How many toasties give a target profit of $2,000?",type:"calc",answer:750,tolerance:.5,difficulty:"hard",explanation:"(Fixed + Target) / CM = ($4,000 + $2,000) / $8 = 750 toasties."},{q:"Promotion drops the price to $10 (variable cost still $4, fixed still $4,000). What is the new break-even in UNITS (round up)?",type:"calc",answer:667,tolerance:1,difficulty:"hard",explanation:"New CM = $10 − $4 = $6. Break-even = $4,000 / $6 = 666.7 → 667 toasties. Lower price = lower CM = higher break-even = more risk."},{q:"For the café at $12 price and $4 variable cost, what is the contribution margin RATIO?",options:["66.7%","33.3%","50%","60%"],answer:0,difficulty:"hard",explanation:"CM ratio = CM / Price = $8 / $12 = 0.667 = 66.7%."},{q:"Which cost is ALWAYS irrelevant to a short-term decision?",options:["Incremental cost","Opportunity cost","Sunk cost","Avoidable cost"],answer:2,difficulty:"hard",explanation:"A sunk cost has already been incurred and cannot change between alternatives, so it is ALWAYS irrelevant. Relevant costs are future and differ between options."},{q:"An electricity bill with a fixed monthly service charge plus a usage-based charge is an example of a:",options:["Pure fixed cost","Pure variable cost","Mixed (semi-variable) cost","Sunk cost"],answer:2,explanation:"A mixed (semi-variable) cost has both a fixed component (service charge) and a variable component (usage) — it must be split for CVP analysis."}],9:[{q:"Alpha division: operating profit $400,000, total investment $2,500,000. What is its ROI (as a %)?",type:"calc",answer:16,tolerance:.1,difficulty:"hard",explanation:"ROI = Operating profit / Total investment = $400,000 / $2,500,000 = 16%."},{q:"Beta division: operating profit $280,000, total investment $1,600,000, required rate 12%. What is its Residual Income ($)?",type:"calc",answer:88e3,tolerance:.5,difficulty:"hard",explanation:"RI = Profit − (Investment × required rate) = $280,000 − ($1,600,000 × 12%) = $280,000 − $192,000 = $88,000."},{q:"Alpha: profit $400,000, investment $2,500,000, required rate 10%. What is Alpha's Residual Income ($)?",type:"calc",answer:15e4,tolerance:.5,difficulty:"hard",explanation:"RI = $400,000 − ($2,500,000 × 10%) = $400,000 − $250,000 = $150,000."},{q:"A manager who controls costs, revenue AND the division's assets runs which type of responsibility centre?",options:["Cost centre","Revenue centre","Profit centre","Investment centre"],answer:3,difficulty:"hard",explanation:"An INVESTMENT centre manager controls costs, revenue and assets, and is measured by ROI or Residual Income. A profit centre controls only costs and revenue."},{q:"The Balanced Scorecard measures performance across four perspectives. Which is NOT one of them?",options:["Financial","Customer","Internal Business Processes","Government & Regulation"],answer:3,difficulty:"hard",explanation:"The four perspectives are Financial, Customer, Internal Business Processes, and Innovation & Improvement (Learning & Growth). 'Government & Regulation' is not one of them."},{q:"Exam Q9: ROI ranks Beta higher (17.5% vs 16%) but RI ranks Alpha higher ($150k vs $88k). Explain why, and which division creates more value.",type:"short",answer:"ROI is a percentage, so smaller Beta looks more efficient per dollar invested (17.5% > 16%). RI is an absolute dollar figure of profit earned ABOVE the required return, so larger Alpha creates more value ($150,000 > $88,000). RI avoids ROI's underinvestment problem — judged on ROI alone, a manager might reject a value-adding project that lowers their average ROI.",explanation:"ROI (%) favours size-neutral comparison; RI ($) favours absolute value created. They can rank divisions differently."}],10:[{q:"Pine Ltd: sales $3,000,000, net profit $240,000. What is the net profit margin (as a %)?",type:"calc",answer:8,tolerance:.1,difficulty:"hard",explanation:"Profit margin = Net profit / Sales = $240,000 / $3,000,000 = 8%."},{q:"Pine Ltd: sales $3,000,000, average total assets $1,200,000. What is the asset turnover (in times)?",type:"calc",answer:2.5,tolerance:.05,difficulty:"hard",explanation:"Asset turnover = Sales / Average total assets = $3,000,000 / $1,200,000 = 2.5 times."},{q:"Using DuPont (ROA = profit margin × asset turnover), what is Pine Ltd's ROA (as a %)?",type:"calc",answer:20,tolerance:.1,difficulty:"hard",explanation:"ROA = 8% × 2.5 = 20%. Check: $240,000 / $1,200,000 = 20%."},{q:"Current assets $200,000 (including $40,000 inventory), current liabilities $100,000. What is the QUICK (acid-test) ratio?",type:"calc",answer:1.6,tolerance:.05,difficulty:"hard",explanation:"Quick ratio = (Current Assets − Inventory) / Current Liabilities = ($200,000 − $40,000) / $100,000 = 1.6."},{q:"Cost of sales $600,000 and average inventory $50,000. What is the TIMES INVENTORY TURNOVER?",type:"calc",answer:12,tolerance:.1,difficulty:"hard",explanation:"Inventory turnover = Cost of Sales / Average Inventory = $600,000 / $50,000 = 12 times. (Days inventory = 365 / 12 ≈ 30 days.)"},{q:"Total liabilities $400,000 and total assets $1,000,000. What is DEBT TO TOTAL ASSETS (as a %)?",type:"calc",answer:40,tolerance:.1,difficulty:"hard",explanation:"Debt to total assets = Total Liabilities / Total Assets = $400,000 / $1,000,000 = 40%. Higher = more leveraged = more risk."},{q:"Exam Q7 asks for one strategy to lift ROA via EACH DuPont component. Give one for profit margin and one for asset turnover.",type:"short",answer:"Profit margin: earn more profit per sale — e.g. cut operating costs or raise selling prices. Asset turnover: generate more sales from the same assets — e.g. improve inventory turnover, collect receivables faster, or dispose of idle assets.",explanation:"Margin = profitability per sale; turnover = sales efficiency per dollar of assets. ROA improves if either rises."}]},jn={};for(const u of Object.keys(Yu))jn[u]=[...Yu[u],...df[u]||[]];const Fa={1:[{front:"Financial Accounting — who is it for?",back:"EXTERNAL users: investors, banks, creditors, the ATO. It is mandatory, follows AASB standards, and is historical."},{front:"Management Accounting — who is it for?",back:"INTERNAL users: managers and owners. Flexible, no set format, forward-looking (budgets & forecasts), not audited."},{front:"Sole Trader",back:"One owner. Simple & cheap to set up. NOT a separate legal entity → UNLIMITED personal liability."},{front:"Partnership",back:"2+ owners sharing profits. Governed by a partnership agreement. ALL partners have UNLIMITED joint liability."},{front:"Company (Pty Ltd)",back:"A SEPARATE legal entity. Owners = shareholders with LIMITED liability. More costly/complex; taxed at company rate."},{front:"Trust",back:"A trustee holds assets FOR beneficiaries. Used for asset protection & tax planning. Common in family businesses."},{front:"Which structure has LIMITED liability?",back:"A company — shareholders only risk what they invested. Sole traders and partnerships have UNLIMITED liability."},{front:"Best accounting for an expansion decision?",back:"MANAGEMENT accounting — it provides budgets, forecasts and cost analysis to guide internal decisions."},{front:"Is management accounting mandatory?",back:"No. It is optional, flexible, and prepared as often as managers need it. Financial accounting IS mandatory."},{front:"Memory hook: Financial vs Management",back:"Financial = your TAX RETURN (for outsiders, formal). Management = your PRIVATE NOTES (for you, flexible)."},{front:"The three business structures + liability",back:"Sole Proprietorship (1 owner, UNLIMITED liability); Partnership (2+ owners, UNLIMITED joint liability); Company (shareholders, LIMITED liability, separate legal entity)."},{front:"Public (Ltd) vs Proprietary (Pty Ltd) company",back:"Public (Ltd): can sell shares to the public, large, heavily regulated, must report. Proprietary (Pty Ltd): cannot sell to public, smaller, moderate regulation."},{front:"Corporate regulation in Australia",back:"The CORPORATIONS ACT (primary law) is enforced by ASIC. Other regulators: ASX, ACCC, RBA, APRA, ATO."}],2:[{front:"Two FUNDAMENTAL qualitative characteristics",back:"1) RELEVANCE and 2) FAITHFUL REPRESENTATION. These come first — info must have both."},{front:"Relevance",back:"Info that can MAKE A DIFFERENCE to decisions. Has predictive value, confirmatory value, and considers materiality."},{front:"Faithful Representation",back:"Info must be COMPLETE, NEUTRAL (unbiased), and FREE FROM ERROR."},{front:"Four ENHANCING characteristics (C-V-T-U)",back:"Comparability, Verifiability, Timeliness, Understandability. They boost — but can't replace — the fundamentals."},{front:"Comparability",back:"Users can identify similarities/differences between entities and over time. Supported by CONSISTENT policies."},{front:"Verifiability",back:"Different knowledgeable, independent observers could reach the same conclusion about the information."},{front:"Timeliness",back:"Information is available in time to influence decisions. Old information loses usefulness."},{front:"Understandability",back:"Information is clearly classified, characterised and presented for a reasonably knowledgeable user."},{front:"Materiality",back:"Entity-specific aspect of relevance. An item is material if omitting/misstating it could influence a user's decision."},{front:"Does 'free from error' mean 100% accurate?",back:"No — estimates are allowed. It means no errors in the description or the process used to produce the information."},{front:"Who issues the Conceptual Framework?",back:"The AASB. It provides the concepts that underpin and guide all individual accounting standards."}],3:[{front:"Cash basis vs Accrual basis",back:"CASH = record when cash moves. ACCRUAL = record when the event occurs (earned/incurred). AASB requires ACCRUAL."},{front:"When does accrual recognise REVENUE?",back:"When EARNED (goods/services delivered) — regardless of when cash is received."},{front:"When does accrual recognise an EXPENSE?",back:"When INCURRED (benefit used) — regardless of when cash is paid."},{front:"Why depreciate an asset?",back:"The MATCHING PRINCIPLE — spread the asset's cost over the periods (useful life) that benefit from it."},{front:"Straight-line depreciation formula",back:"(Cost − Residual Value) ÷ Useful Life = annual depreciation expense."},{front:"Carrying amount (book value)",back:"Cost − Accumulated Depreciation. It's a book figure, NOT the market/resale value."},{front:"Laptop: $3,000, 3 years, $0 residual",back:"Depreciation = $1,000/yr. After yr1 = $2,000; yr2 = $1,000; yr3 = $0 carrying amount."},{front:"Where does depreciation appear?",back:"Depreciation EXPENSE → Income Statement. ACCUMULATED depreciation → Balance Sheet (reduces the asset)."},{front:"Residual (salvage) value",back:"The estimated value of the asset at the END of its useful life — subtracted before spreading the cost."},{front:"Is depreciation a cash expense?",back:"No — it's a NON-CASH expense. Cash left when the asset was bought; depreciation just allocates that cost over time."},{front:"Three depreciation methods",back:"1) Straight-line: (Cost − Residual) ÷ Life. 2) Reducing-balance: (Cost − Accum Dep) × Rate (front-loaded). 3) Units-of-production: [(Cost − Residual) ÷ total units] × units used."},{front:"Reducing-balance — quick example",back:"$10,000 asset at 30%: Yr1 = $10,000 × 30% = $3,000; Yr2 = ($10,000 − $3,000) × 30% = $2,100. Higher expense early."},{front:"Depreciation vs Amortisation",back:"Depreciation = allocating the cost of TANGIBLE assets over their life. Amortisation = the same for INTANGIBLE assets (patents, software)."}],4:[{front:"Definition of an ASSET",back:"A resource CONTROLLED by the entity, from a PAST event, expected to bring FUTURE economic benefits."},{front:"Definition of a LIABILITY",back:"A PRESENT obligation, from a past event, that will require a future OUTFLOW (sacrifice) of resources."},{front:"Definition of EQUITY",back:"Assets − Liabilities. The owner's RESIDUAL interest in the business."},{front:"Definition of INCOME",back:"Increases in equity NOT arising from owner contributions (includes revenue and gains)."},{front:"Definition of an EXPENSE",back:"Decreases in equity NOT arising from owner drawings (e.g. wages, rent, depreciation)."},{front:"Recognition criteria",back:"(1) Meets the element DEFINITION, AND (2) future flow is PROBABLE and the amount is RELIABLY MEASURABLE."},{front:"'Probable' means…",back:"More likely than not to occur."},{front:"Highope Ltd $300k platinum — asset?",back:"NO. No platinum found + no experience → future benefits NOT probable → fails recognition → EXPENSE it."},{front:"What does 'control' mean for an asset?",back:"The entity can direct the resource's use and obtain its economic benefits (legal title isn't strictly required)."},{front:"Are drawings an expense?",back:"No — drawings reduc
