e?",back:"No — drawings reduce EQUITY directly. They are a distribution to the owner, not a business cost."},{front:"Revenue vs Income",back:"Revenue is a sub-type of income (from ordinary activities). Income = revenue + gains."},{front:"Asset — 3 criteria (ALL needed)",back:"1) Present economic resource (potential future benefits), 2) Controlled by the entity, 3) Result of a past event."},{front:"Recognition criteria (course version)",back:"Meets the element DEFINITION + provides USEFUL info → it is RELEVANT and a FAITHFUL REPRESENTATION (complete, neutral, free from error)."}],5:[{front:"The accounting equation",back:"ASSETS = LIABILITIES + EQUITY. It ALWAYS balances (double-entry)."},{front:"Why must it always balance?",back:"Double-entry: every transaction has equal and opposite effects on at least two accounts."},{front:"Owner invests cash",back:"Assets ↑ (cash) and Equity ↑ (capital) by the same amount."},{front:"Buy equipment for cash",back:"ASSET SWAP — Cash ↓, Equipment ↑. Total assets unchanged."},{front:"Buy supplies on credit",back:"Assets ↑ (supplies) and Liabilities ↑ (accounts payable)."},{front:"Cash sales (earn revenue)",back:"Assets ↑ (cash) and Equity ↑ (via revenue)."},{front:"Repay a loan",back:"Assets ↓ (cash) and Liabilities ↓ (loan). Equity unchanged."},{front:"Owner withdraws cash (drawings)",back:"Assets ↓ (cash) and Equity ↓ (drawings). NOT an expense."},{front:"Pay an expense (e.g. rent) in cash",back:"Assets ↓ (cash) and Equity ↓ (expense reduces the owner's stake)."},{front:"Sneaker business final balances",back:"Assets $18,500 = Liabilities $1,500 + Equity $17,000. ✓ Balanced. (Cash $11,500 + Equipment $5,000 + Supplies $2,000 = $18,500.)"},{front:"Collect cash from a debtor",back:"ASSET SWAP — Cash ↑, Receivable ↓. No new revenue (earned earlier)."}],6:[{front:"What are balance day adjustments?",back:"End-of-period entries that update the accounts for accrual accounting — matching revenue & expenses to the right period."},{front:"Accrued Revenue",back:"Earned but NOT yet received. Effect: Asset ↑ (receivable), Equity ↑ (revenue). e.g. interest earned, not received."},{front:"Accrued Expense",back:"Incurred but NOT yet paid. Effect: Liability ↑ (payable), Equity ↓ (expense). e.g. wages owed, electricity owed."},{front:"Prepaid Expense",back:"Paid in advance for a FUTURE benefit. Starts as an ASSET; becomes an expense as it's used. e.g. insurance prepaid."},{front:"Unearned Revenue",back:"Cash received BEFORE earning it. A LIABILITY until the service is delivered. e.g. customer deposit/prepayment."},{front:"When unearned revenue is finally earned",back:"Liability ↓ and Revenue ↑ (Equity ↑). The obligation is satisfied."},{front:"Insurance paid for next 6 months — type?",back:"PREPAID expense → recorded as an asset first, expensed gradually as the months pass."},{front:"Customer prepays for next period — type?",back:"UNEARNED revenue → a liability (you owe them the service)."},{front:"When are adjustments made?",back:"At the END of the reporting period, before the financial statements are prepared."},{front:"Forget to record an accrued expense — effect?",back:"Expenses understated → PROFIT OVERSTATED (and liabilities understated)."},{front:"Accruals vs Prepayments (2×2)",back:"Accrued revenue = ASSET. Accrued expense = LIABILITY. Prepaid (unearned) revenue = LIABILITY. Prepaid expense = ASSET."},{front:"Bad debts: two methods",back:"Direct write-off — expense only WHEN a debt goes bad (violates matching). Allowance method — ESTIMATE bad debts in the period of sale (PREFERRED, matches expense to revenue)."},{front:"Allowance for Doubtful Debts — what is it?",back:"A CONTRA-ASSET that reduces Accounts Receivable. Recording it raises Bad Debts Expense (Equity ↓) in the sale period."}],7:[{front:"Three main financial statements",back:"1) Income Statement (P&L), 2) Balance Sheet, 3) Statement of Cash Flows."},{front:"Income Statement formula",back:"Revenue − Expenses = Net Profit. Covers a PERIOD."},{front:"Balance Sheet equation",back:"Assets = Liabilities + Equity. A snapshot at a POINT IN TIME."},{front:"Cash Flow Statement — 3 sections",back:"Operating (O), Investing (I), Financing (F)."},{front:"Operating activities (O)",back:"Day-to-day trading: receipts from customers, paying suppliers/wages, interest paid. The business 'heartbeat'."},{front:"Investing activities (I)",back:"Buying/selling LONG-TERM assets: equipment, property, vehicles (and related refunds)."},{front:"Financing activities (F)",back:"How the business is funded: issuing shares, borrowing, repaying loans, paying dividends/drawings."},{front:"Why is operating cash flow so important?",back:"It shows the core business generates REAL cash — not just paper profit. A profitable firm can still run out of cash."},{front:"Profit but negative operating cash flow — why?",back:"Profit is accrual-based. Credit customers may not have paid yet, or stock was built up, tying up cash."},{front:"Dividends/drawings — which section?",back:"FINANCING outflow (a return to the owners)."},{front:"The FOUR financial statements",back:"1) Balance Sheet (position, point in time), 2) Income Statement (profit, over a period), 3) Statement of Changes in Equity (links profit to balance sheet), 4) Cash Flow Statement (cash, O/I/F)."},{front:"Income statement structure",back:"Sales − Cost of Sales = GROSS PROFIT; + Other Income − Operating Expenses = PROFIT BEFORE TAX; − Income Tax = PROFIT AFTER TAX."},{front:"Statement of Changes in Equity",back:"Opening Equity + Profit − Drawings = Closing Equity. The closing figure flows onto the Balance Sheet."}],8:[{front:"Contribution Margin (CM) per unit",back:"Selling Price − Variable Cost per unit. What each unit contributes to fixed costs, then profit."},{front:"Break-even point (units)",back:"Fixed Costs ÷ CM per unit. The sales level where profit = 0."},{front:"Break-even point (dollars)",back:"Break-even units × Selling Price (or Fixed Costs ÷ CM ratio)."},{front:"Target profit (units)",back:"(Fixed Costs + Target Profit) ÷ CM per unit."},{front:"CM ratio",back:"CM per unit ÷ Selling Price. e.g. $8 ÷ $12 = 66.7%."},{front:"Café example: $12 price, $4 variable, $4,000 fixed",back:"CM = $8. Break-even = 500 units ($6,000). For $2,000 profit = 750 units."},{front:"Price drop $12 → $10 effect",back:"CM falls to $6, break-even rises to ~667 units. Lower CM = MORE units needed = HIGHER risk."},{front:"Fixed vs Variable costs",back:"FIXED stay constant in total regardless of volume (e.g. rent). VARIABLE change with volume (e.g. ingredients)."},{front:"Higher CM per unit → break-even?",back:"LOWER break-even (fixed costs covered faster) = less risk."},{front:"What is CVP analysis used for?",back:"Deciding pricing and cost strategies — e.g. effect of a price cut, a promotion, or a cost change on profit."},{front:"Margin of safety",back:"How far actual/budgeted sales are ABOVE break-even — the cushion before the business makes a loss."},{front:"Fixed vs Variable vs Mixed costs",back:"Fixed: constant in total (rent). Variable: change in proportion to activity (materials). Mixed/semi-variable: both parts (electricity = service charge + usage)."},{front:"Relevant costs & the sunk cost rule",back:"Only FUTURE costs that DIFFER between alternatives are relevant. A SUNK cost (already incurred) is ALWAYS irrelevant. Opportunity cost = benefit given up."},{front:"Make-or-buy & special order rules",back:"Make-or-buy: choose the lower of make vs buy cost. Special order: accept if incremental revenue > incremental cost (and there's idle capacity)."}],9:[{front:"Return on Investment (ROI)",back:"Operating Profit ÷ Total Investment × 100. A percentage return on invested funds."},{front:"Residual Income (RI)",back:"Operating Profit − (Total Investment × Required Rate). Profit ABOVE the minimum required, in dollars."},{front:"Alpha: $400k profit, $2.5m investment, 10%",back:"ROI = 16%. RI = $400k − $250k = $150,000."},{front:"Beta: $280k profit, $1.6m investment, 12%",back:"ROI = 17.5%. RI = $280k − $192k = $88,000."},{front:"ROI vs RI — who wins?",back:"By ROI, BETA wins (17.5% > 16%). By RI, ALPHA wins ($150k > $88k). They can disagree!"},{front:"What does RI > 0 mean?",back:"The division earned MORE than its required return — it created value for the firm."},{front:"ROI's big limitation (dysfunctional behaviour)",back:"A manager may REJECT a project that beats the required rate but lowers their division's average ROI — hurting the firm."},{front:"How does RI fix that problem?",back:"RI encourages accepting ANY project with positive RI (above the required return) → better goal congruence."},{front:"ROI advantage & limitation",back:"ADVANTAGE: simple %, compares different-sized divisions fairly. LIMITATION: can drive dysfunctional/short-term decisions."},{front:"RI advantage & limitation",back:"ADVANTAGE: promotes goal congruence. LIMITATION: absolute $ figure → harder to compare different-sized divisions."},{front:"'Required rate of return' = ?",back:"The minimum acceptable return — the cost of capital / hurdle rate used in the RI calculation."},{front:"Responsibility centres",back:"Cost centre (costs only); Revenue centre (revenue only); Profit centre (costs & revenue → profit); Investment centre (costs, revenue & assets → ROI/RI)."},{front:"DuPont ROI decomposition",back:"ROI = Profit Margin × Investment Turnover = (Profit ÷ Sales) × (Sales ÷ Investment). Shows WHY ROI is high or low."},{front:"ROI 'asset age' problem",back:"Older assets have a low book value, which inflates ROI — making old-asset divisions look better and discouraging new investment."},{front:"Balanced Scorecard — 4 perspectives",back:"Financial · Customer · Internal Business Processes · Innovation & Improvement (Learning & Growth). Adds non-financial, leading indicators to financial lagging ones."}],10:[{front:"Profit Margin",back:"Net Profit ÷ Sales × 100. Cents of profit per $1 of sales."},{front:"Asset Turnover",back:"Sales ÷ Average Total Assets. How efficiently assets generate sales (a multiple, e.g. 2.5×)."},{front:"Return on Assets (ROA)",back:"Net Profit ÷ Average Total Assets × 100. Return per dollar of assets."},{front:"DuPont formula",back:"ROA = Profit Margin × Asset Turnover. Splits ROA into profitability AND efficiency."},{front:"Pine Ltd worked example",back:"PM = 8% ($240k/$3m), AT = 2.5× ($3m/$1.2m), ROA = 8% × 2.5 = 20%. ✓"},{front:"Return on Equity (ROE)",back:"Net Profit ÷ Owner's Equity × 100. The return earned for the owners."},{front:"Gross Profit Margin",back:"Gross Profit ÷ Sales × 100. Profitability before operating expenses."},{front:"Improve ROA via PROFIT MARGIN",back:"Earn more profit per sale: cut costs or raise prices."},{front:"Improve ROA via ASSET TURNOVER",back:"Generate more sales from the same assets: faster inventory turnover, quicker receivables, sell idle assets."},{front:"What does a HIGH asset turnover suggest?",back:"Assets are used efficiently — lots of sales per dollar of assets."},{front:"What does a LOW asset turnover suggest?",back:"Possibly excess, idle or underutilised assets relative to the sales being generated."},{front:"The 4 ratio categories",back:"Liquidity (short-term cash ability), Asset Efficiency (how hard assets work), Capital Structure (solvency/risk), Profitability (operating success)."},{front:"Liquidity: Current vs Quick ratio",back:"Current Ratio = Current Assets ÷ Current Liabilities. Quick (acid-test) Ratio = (Current Assets − Inventory) ÷ Current Liabilities — stricter, excludes slow inventory."},{front:"Asset efficiency: turnover → days",back:"Inventory Turnover = COGS ÷ Avg Inventory; Debtors Turnover = Sales ÷ Avg Debtors. Days = 365 ÷ turnover. Higher turnover / fewer days = better."},{front:"Capital structure (solvency) ratios",back:"Debt to Total Assets = Total Liabilities ÷ Total Assets (higher = more risk). Times Interest Earned = EBIT ÷ Interest Expense (higher = safer)."}]},Va="fst:v1";function Cr(){return{version:1,quiz:{},flashcards:{ ype:"visual",key:"businessStructures",caption:"Liability by structure — only a company is limited."},{type:"table",heading:"Financial vs Management Accounting",columns:["Feature","Financial","Management"],rows:[["Audience","Mainly external (investors, banks, ATO)","Internal only (managers)"],["Reports","General purpose","Specific purpose"],["Detail","Broad overview","Quite detailed"],["Rules","Must follow accounting standards (AASB)","No restrictions"],["Frequency","Mainly annual / semi-annual","Whenever required"],["Time horizon","Mainly historical","Past AND future"],["Info type","Money terms; objective & verifiable","Can include non-financial info"]]},{type:"callout",tone:"tip",body:"Memory hook — Financial = your TAX RETURN (formal, for outsiders, about the past). Management = your PRIVATE NOTES (flexible, for you, about the future). For the exam’s “small partnership considering expansion”, the answer is MANAGEMENT accounting (budgets, forecasts, CVP/break-even)."},{type:"table",heading:"The Three Business Structures",columns:["Structure","Owners","Liability"],rows:[["Sole Proprietorship","1","Unlimited personal liability"],["Partnership","2 or more","Shared — unlimited (joint & several)"],["Company (Ltd / Pty Ltd)","Shareholders","Limited to amount invested"]],note:"A company is a SEPARATE LEGAL ENTITY — only it offers limited liability."},{type:"cards",heading:"Public vs Proprietary Companies",items:[{name:"Public (Ltd)",icon:"🏛️",accent:"blue",points:["Can sell shares to the public","Typically large","Extensive regulation","Must report"]},{name:"Proprietary (Pty Ltd)",icon:"🏢",accent:"green",points:["Cannot sell shares publicly","Usually smaller","Moderate regulation","Reporting depends on size"]}]},{type:"callout",tone:"key",body:"Corporate regulation (Australia): the CORPORATIONS ACT is the primary law, enforced by ASIC. Other regulators: ASX, ACCC, RBA, APRA, ATO."}]},2:{sections:[{type:"intro",heading:"Qualitative Characteristics",body:"The Conceptual Framework sets the qualities that make financial information USEFUL for decisions. There are two FUNDAMENTAL characteristics (information must have both) and four ENHANCING characteristics that improve usefulness."},{type:"visual",key:"qualitativePyramid",caption:"Fundamentals first; the four enhancing qualities build on top."},{type:"cards",heading:"Two Fundamental Characteristics",items:[{name:"Relevance",icon:"🎯",accent:"sky",desc:"Capable of MAKING A DIFFERENCE to decisions — it has predictive value, confirmatory value, and considers materiality."},{name:"Faithful Representation",icon:"✅",accent:"green",desc:"COMPLETE, NEUTRAL (unbiased) and FREE FROM ERROR."}]},{type:"cards",heading:"Four Enhancing Characteristics (C-V-T-U)",items:[{name:"Comparability",icon:"⚖️",accent:"blue",desc:"Consistent across entities and periods, so users can spot similarities and differences."},{name:"Verifiability",icon:"🔍",accent:"purple",desc:"Independent observers could confirm the information."},{name:"Timeliness",icon:"⏰",accent:"amber",desc:"Available before it loses its capacity to influence decisions."},{name:"Understandability",icon:"💡",accent:"sky",desc:"Classified, characterised and presented clearly for knowledgeable users."}]},{type:"callout",tone:"tip",body:"Q2 is 6 marks — likely one mark per characteristic with a brief definition. Don’t confuse fundamental with enhancing. If Relevance and Faithful Representation aren’t met, the other four don’t matter."}]},3:{sections:[{type:"intro",heading:"Cash vs Accrual Accounting",body:"CASH accounting records transactions only when cash is received or paid. ACCRUAL accounting records revenue when EARNED and expenses when INCURRED, regardless of the cash flow. AASB requires the accrual basis for general-purpose reports because it applies the matching principle and gives a truer picture of performance."},{type:"visual",key:"depreciationChart",caption:"Carrying amount falls $1,000 a year to $0 (straight-line)."},{type:"table",heading:"Cash vs Accrual",columns:["","Cash basis","Accrual basis"],rows:[["Revenue recorded when","Cash received","Earned (regardless of cash)"],["Expense recorded when","Cash paid","Incurred (regardless of cash)"],["Required by AASB?","No","Yes"],["Matches revenue & expense?","No","Yes — matching principle"]],note:"Example: work done in June, paid in July → accrual recognises the revenue in JUNE."},{type:"intro",heading:"Depreciation & Amortisation",body:"DEPRECIATION is the systematic allocation of a TANGIBLE asset’s cost over its useful life (AMORTISATION does the same for INTANGIBLE assets). It applies the matching principle. It is a NON-CASH expense and does NOT measure the loss in market value. Depreciation expense = the amount charged this period; accumulated depreciation = the total charged over the asset’s life."},{type:"formulas",heading:"Three Depreciation Methods",items:[{name:"Straight-line",formula:"(Cost − Residual Value) ÷ Useful Life",meaning:"Equal expense each year. Laptop $3,000, 3 yrs, $0 → $1,000/yr."},{name:"Reducing-balance",formula:"(Cost − Accumulated Depreciation) × Rate",meaning:"Higher expense early; applied to the carrying amount (e.g. computers)."},{name:"Units-of-production",formula:"[(Cost − Residual) ÷ Total est. units] × Units used",meaning:"Based on use, not time (e.g. km driven, machine hours)."},{name:"Carrying amount",formula:"Cost − Accumulated Depreciation",meaning:"Book value — NOT market/resale value."}]},{type:"callout",tone:"key",body:"In the statements: Depreciation EXPENSE → Income Statement (reduces profit). Accumulated depreciation → Balance Sheet (a contra-asset reducing the asset’s carrying amount)."}]},4:{sections:[{type:"intro",heading:"The 5 Elements of Financial Statements",body:"The Conceptual Framework defines five building blocks. Knowing the precise definitions — and applying each criterion to the scenario — is high-value exam content (Q4 is 12 marks of analysis)."},{type:"visual",key:"fiveElements",caption:"The five elements — recognise if relevant + faithfully represented."},{type:"cards",heading:"The Five Elements",items:[{name:"Asset",icon:"🏦",accent:"green",desc:"A present economic resource controlled by the entity as a result of past events."},{name:"Liability",icon:"📕",accent:"red",desc:"A present obligation to transfer an economic resource as a result of past events."},{name:"Owner’s Equity",icon:"🧮",accent:"sky",desc:"The residual interest in the assets after deducting all liabilities (Assets − Liabilities)."},{name:"Income",icon:"📈",accent:"blue",desc:"Increases in assets / decreases in liabilities that increase equity — excluding owner contributions."},{name:"Expense",icon:"📉",accent:"amber",desc:"Decreases in assets / increases in liabilities that decrease equity — excluding distributions to owners."}]},{type:"cards",heading:"The 3 Criteria (ALL must be met)",items:[{name:"Asset",icon:"🟢",accent:"green",points:["Present economic resource (potential to produce future benefits)","Controlled by the entity","Result of a past event"]},{name:"Liability",icon:"🔴",accent:"red",points:["Present obligation (no practical ability to avoid)","To transfer an economic resource","Result of a past event"]}]},{type:"callout",tone:"key",body:"Recognition criteria (for assets AND liabilities): an item is recognised only if it provides USEFUL information — i.e. it is RELEVANT and a FAITHFUL REPRESENTATION. (Older texts phrase this as “probable + reliably measurable”.)"},{type:"callout",tone:"tip",body:"Highope Ltd ($300k platinum): control (licence) and past event are arguable, but future benefits are NOT probable (no platinum found, no experience), so recognising an asset would not be relevant/faithful → EXPENSE it. Always link every criterion back to the scenario facts using “because”."}]},5:{sections:[{type:"intro",heading:"The Accounting Equation",body:"Every transaction is recorded so the accounting equation stays in balance. Each transaction has a MINIMUM of two effects (dual effect) — this is the heart of double-entry accounting."},{type:"visual",key:"accountingEquation",caption:"Assets = Liabilities + Equity — it always balances."},{type:"formulas",heading:"The Equation",items:[{name:"Basic equation",formula:"Assets = Liabilities + Owner’s Equity",meaning:"Resources = how they were financed (lenders + owners)."},{name:"Extended equation",formula:"A = L + OE + Income − Expenses + Capital − Drawings",meaning:"Income & capital ADD to equity; expenses & drawings SUBTRACT."}]},{type:"table",heading:"Transaction Patterns",columns:["Transaction","Effect"],rows:[["Owner invests cash","Assets ↑, Equity ↑"],["Buy asset with cash","Assets ↑↓ (swap — net zero)"],["Buy asset on credit","Assets ↑, Liabilities ↑"],["Earn cash revenue","Assets ↑, Equity ↑"],["Pay cash expense","Assets ↓, Equity ↓"],["Repay a loan","Assets ↓, Liabilities ↓"],["Owner withdraws (drawings)","Assets ↓, Equity ↓ (NOT an expense)"]]},{type:"callout",tone:"key",body:"Sneaker business final balances: Assets $18,500 (Cash $11,500 + Equipment $5,000 + Supplies $2,000) = Liabilities $1,500 + Equity $17,000 ($15,000 capital + $3,000 revenue − $1,000 drawings). Always do the balance check. Use the interactive step-through below."}]},6:{sections:[{type:"intro",heading:"Balance Day Adjustments",body:"Accounting divides the business’s life into artificial reporting periods. Balance day adjustments are end-of-period entries that apply the ACCRUAL basis — putting revenues and expenses in the correct period regardless of when cash moved."},{type:"visual",key:"adjustmentsMatrix",caption:"Accruals vs prepayments — and whether each is an asset or a liability."},{type:"table",heading:"The 4 Types (Accruals vs Prepayments)",columns:["","Accruals","Prepayments"],rows:[["Revenues","Accrued revenue → ASSET","Prepaid (unearned) revenue → LIABILITY"],["Expenses","Accrued expense → LIABILITY","Prepaid expense → ASSET"]],note:"Trigger words: “not yet received/paid” = accrual. “In advance / prepaid” = prepayment."},{type:"cards",heading:"Effect on the Equation",items:[{name:"Accrued Revenue",icon:"💰",accent:"green",desc:"Earned, not yet received → Asset ↑ (receivable), Equity ↑ (revenue). e.g. $2,000 interest earned."},{name:"Accrued Expense",icon:"📄",accent:"red",desc:"Incurred, not yet paid → Liability ↑ (payable), Equity ↓ (expense). e.g. $3,500 wages owed."},{name:"Prepaid Expense",icon:"⏳",accent:"blue",desc:"Paid in advance → Asset first; as used, Asset ↓ & Equity ↓. e.g. $1,200 insurance for 6 months."},{name:"Unearned Revenue",icon:"🎫",accent:"purple",desc:"Cash received before earning → Liability; as earned, Liability ↓ & Revenue ↑. e.g. $4,000 customer advance."}]},{type:"intro",heading:"Bad & Doubtful Debts",body:"When a business sells on credit, some debtors won’t pay. The accrual concept requires accounting for this. There are two methods."},{type:"cards",heading:"Two Methods",items:[{name:"Direct Write-Off",icon:"✂️",accent:"amber",desc:"Write the debt off as a Bad Debts Expense only WHEN it goes bad (Accounts Receivable ↓, Expense ↑). Criticism: the loss often lands in a later period than the sale → violates matching."},{name:"Allowance Method",icon:"🛡️",accent:"green",desc:"ESTIMATE uncollectible debts and record an expense in the period of sale (Allowance for Doubtful Debts ↑ as a contra-asset, Bad Debts Expense ↑). PREFERRED — it matches the expense to the revenue period."}]},{type:"callout",tone:"warn",body:"Forgetting an accrued expense understates expenses → OVERSTATES profit (and understates liabilities)."}]},7:{sections:[{type:"intro",heading:"The Four Financial Statements",body:"The statements tell a connected story. Note there are FOUR — the Statement of Changes in Equity links profit to the Balance Sheet."},{type:"visual",key:"statementsFlow",caption:"How the four statements connect (profit → equity → balance sheet)."},{type:"cards",heading:"The Four Statements",items:[{name:"Statement of Financial Position (Balance Sheet)",icon:"📊",accent:"sky",desc:"Assets, liabilities & equity at a POINT IN TIME. Assets = Liabilities + Equity."},{name:"Statement of Profit or Loss (Income Statement)",icon:"📈",accent:"green",desc:"Revenue & expenses over a PERIOD → profit."},{name:"Statement of Changes in Owner’s Equity",icon:"🔁",accent:"purple",desc:"Opening Equity + Profit − Drawings = Closing Equity. Bridges profit to the Balance Sheet."},{name:"Statement of Cash Flows",icon:"💵",accent:"amber",desc:"Actual cash in/out over a PERIOD, split into Operating, Investing, Financing."}]},{type:"formulas",heading:"Income Statement Structure",items:[{name:"Gross Profit",formula:"Sales − Cost of Sales"},{name:"Profit before tax",formula:"Gross Profit + Other Income − Operating Expenses"},{name:"Profit after tax",formula:"Profit before Tax − Income Tax Expense"}]},{type:"table",heading:"Cash Flow — Three Activities",columns:["Section","What it includes","Examples"],rows:[["Operating (O)","Day-to-day trading","Receipts from customers, payments to suppliers/employees, interest paid, tax"],["Investing (I)","Buying/selling long-term assets","Buy equipment, sell property, equipment refund"],["Financing (F)","How the business is funded","Issue shares, borrow/repay loans, dividends/drawings"]],note:"Exam traps: interest PAID = Operating (AASB); dividends paid = Financing; equipment refund = Investing."},{type:"visual",key:"cashFlowBuckets",caption:"The three cash-flow sections and what falls in each."},{type:"callout",tone:"key",body:"Profit ≠ Cash. A profitable business can still run out of cash. Positive OPERATING cash flow is the key sign of health. Net change in cash = Operating + Investing + Financing."}]},8:{sections:[{type:"intro",heading:"What is CVP Analysis?",body:"Cost-Volume-Profit analysis examines how costs, volume and price affect profit. It is a MANAGEMENT accounting tool for planning profit, break-even, target profit, and short-term decisions. Key assumption: costs are either FIXED or VARIABLE."},{type:"visual",key:"breakEvenChart",caption:"Break-even = where the revenue and cost lines cross (café: 500 units)."},{type:"cards",heading:"Cost Behaviour",items:[{name:"Fixed Costs",icon:"🏠",accent:"blue",desc:"Do NOT change with activity (rent, insurance, depreciation). Fixed cost PER UNIT falls as volume rises."},{name:"Variable Costs",icon:"📦",accent:"green",desc:"Change in direct proportion to activity (materials, commissions). Variable cost PER UNIT stays constant."},{name:"Mixed (Semi-variable)",icon:"🔀",accent:"amber",desc:"Both a fixed and a variable part (e.g. electricity = service charge + usage). Split before CVP."},{name:"Relevant Range",icon:"📏",accent:"sky",desc:"The activity range over which the fixed/variable assumptions hold."}]},{type:"formulas",heading:"Core CVP Formulas",items:[{name:"CM per unit",formula:"Selling Price − Variable Cost per unit"},{name:"CM Ratio",formula:"CM per unit ÷ Selling Price × 100"},{name:"Break-Even (units)",formula:"Fixed Costs ÷ CM per unit"},{name:"Break-Even (dollars)",formula:"Fixed Costs ÷ CM Ratio"},{name:"Target Profit (units)",formula:"(Fixed Costs + Target Profit) ÷ CM per unit"},{name:"Operating Profit",formula:"Contribution Margin − Fixed Costs",meaning:"The management-accounting income format: Sales − Variable = CM − Fixed = Profit."}]},{type:"table",heading:"Relevant Costs for Decisions",columns:["Term","Meaning"],rows:[["Relevant cost","A FUTURE cost that DIFFERS between alternatives"],["Incremental cost","The extra cost of choosing one option"],["Opportunity cost","The benefit given up by not choosing the next-best option"],["Sunk cost","A past cost already incurred — ALWAYS irrelevant"]],note:"Make-or-buy: choose the lower of make vs buy cost. Special order: accept if incremental revenue > incremental cost (idle capacity)."},{type:"callout",tone:"tip",body:"Café toastie: CM $8, break-even 500 units ($6,000), 750 units for $2,000 profit. Drop price to $10 → CM $6 → break-even 667 → MORE risk. Try the interactive calculator below."}]},9:{sections:[{type:"intro",heading:"Performance Measurement",body:"Organisations set a mission → strategy → objectives, then measure whether objectives are met. How performance is measured depends on the type of RESPONSIBILITY CENTRE a manager runs."},{type:"visual",key:"roiVsRi",caption:"ROI favours Beta (17.5%); RI favours Alpha ($150k) — they can disagree."},{type:"table",heading:"Responsibility Centres",columns:["Type","Manager controls…","Measured by"],rows:[["Cost Centre","Costs only","Variance from budgeted costs"],["Revenue Centre","Revenue only","Variance from budgeted revenue"],["Profit Centre","Costs & revenue","Profit (Revenue − Costs)"],["Investment Centre","Costs, revenue & assets","ROI or Residual Income"]],note:"Responsibility accounting: only judge managers on items WITHIN THEIR CONTROL."},{type:"formulas",heading:"ROI & Residual Income",items:[{name:"Return on Investment (ROI)",formula:"Operating Profit ÷ Total Investment × 100",meaning:"Alpha: $400k ÷ $2.5m = 16%. Beta: $280k ÷ $1.6m = 17.5%."},{name:"DuPont ROI",formula:"(Profit ÷ Sales) × (Sales ÷ Investment)",meaning:"Profit Margin × Investment Turnover."},{name:"Residual Income (RI)",formula:"Operating Profit − (Required Rate × Investment)",meaning:"Alpha: $400k − (10% × $2.5m) = $150k. Beta: $280k − (12% × $1.6m) = $88k."}]},{type:"cards",heading:"ROI vs RI",items:[{name:"ROI — advantages",icon:"✅",accent:"green",points:["Single, easy summary measure","Compares divisions of DIFFERENT sizes (a ratio)","Encourages efficient asset use"]},{name:"ROI — disadvantages",icon:"⚠️",accent:"amber",points:["Short-term bias — may reject good projects that dilute ROI","Asset-age problem: old assets → low book value → inflated ROI","Distorted by different accounting policies"]},{name:"RI — advantage",icon:"✅",accent:"green",desc:"Accepts ANY project earning above the required rate → better value-creating decisions. RI > 0 = value created."},{name:"RI — limitation",icon:"⚠️",accent:"amber",desc:"An absolute $ figure → can’t fairly compare divisions of different sizes."}]},{type:"cards",heading:"The Balanced Scorecard (Kaplan & Norton)",items:[{name:"Financial",icon:"💰",accent:"green",desc:"“How do we look to shareholders?” — ROI, RI, profit margin, revenue growth."},{name:"Customer",icon:"🤝",accent:"sky",desc:"“How do customers see us?” — satisfaction, market share, retention."},{name:"Internal Business Processes",icon:"⚙️",accent:"blue",desc:"“What must we excel at?” — defect rate, cycle time, efficiency."},{name:"Innovation & Improvement",icon:"🌱",accent:"purple",desc:"“Can we keep improving?” — training, new-product revenue, R&D."}]},{type:"callout",tone:"key",body:"Financial measures alone are LAGGING indicators. The Balanced Scorecard adds non-financial perspectives so short-term profit isn’t chased at the expense of long-term health."}]},10:{sections:[{type:"intro",heading:"Financial Statement Analysis",body:"Ratios turn raw statements into insight. Always compare to a benchmark: prior years (intra-entity / trend), competitors (inter-entity), or industry averages. There are FOUR categories of ratios."},{type:"visual",key:"dupontTree",caption:"DuPont splits ROA into profit margin × asset turnover."},{type:"table",heading:"The 4 Categories",columns:["Category","Measures"],rows:[["Liquidity","Short-term ability to pay debts with cash"],["Asset Efficiency","How efficiently assets are used to generate cash"],["Capital Structure","Long-term solvency / risk (use of debt)"],["Profitability","Operating success of the entity"]]},{type:"formulas",heading:"Profitability & DuPont",items:[{name:"Profit Margin",formula:"Net Profit ÷ Sales × 100",meaning:"Pine Ltd: $240k ÷ $3m = 8%."},{name:"Asset Turnover",formula:"Sales ÷ Average Total Assets",meaning:"Pine Ltd: $3m ÷ $1.2m = 2.5×."},{name:"ROA (DuPont)",formula:"Profit Margin × Asset Turnover = Net Profit ÷ Avg Total Assets",meaning:"Pine Ltd: 8% × 2.5 = 20%."},{name:"ROE",formula:"Net Profit ÷ Average Owner’s Equity × 100"},{name:"Gross Profit Margin",formula:"Gross Profit ÷ Sales × 100"}]},{type:"formulas",heading:"Liquidity · Efficiency · Solvency",items:[{name:"Current Ratio",formula:"Current Assets ÷ Current Liabilities"},{name:"Quick (Acid-Test) Ratio",formula:"(Current Assets − Inventory) ÷ Current Liabilities"},{name:"Inventory Turnover",formula:"Cost of Sales ÷ Average Inventory  ·  Days = 365 ÷ turnover"},{name:"Debtors Turnover",formula:"Sales ÷ Average Trade Debtors  ·  Days = 365 ÷ turnover"},{name:"Debt to Total Assets",formula:"Total Liabilities ÷ Total Assets × 100",meaning:"Higher = more leveraged = more risk."},{name:"Times Interest Earned",formula:"EBIT ÷ Interest Expense",meaning:"Higher = interest more safely covered."}]},{type:"callout",tone:"key",body:"DuPont: a low ROA is thin margins, slow asset turnover, or both — DuPont tells you which. No ratio is good or bad alone; always compare and explain WHY using the numbers. Improve ROA via margin (cut costs / raise prices) or turnover (more sales from the same assets)."}]}},x={txt:"#e2e8f0",sub:"#94a3b8",em:"#34d399",sky:"#38bdf8",rose:"#fb7185",amber:"#fbbf24",purple:"#c084fc",box:"#1e293b",line:"#475569"};function le({x:u,y:m,w:c,h:w,stroke:k,label:v,sub:S,fill:T=x.box,tc:I=x.txt}){return a.jsxs("g",{children:[a.jsx("rect",{x:u,y:m,width:c,height:w,rx:"6",fill:T,stroke:k,strokeWidth:"1.5"}),a.jsx("text",{x:u+c/2,y:m+(S?w/2-4:w/2+4),textAnchor:"middle",fill:I,fontSize:"12",fontWeight:"600",children:v}),S&&a.jsx("text",{x:u+c/2,y:m+w/2+12,textAnchor:"middle",fill:x.sub,fontSize:"9.5",children:S})]})}const $f=()=>a.jsxs("svg",{viewBox:"0 0 340 80",width:"100%",children:[a.jsx(le,{x:8,y:20,w:92,h:42,stroke:x.sky,label:"ASSETS",sub:"what you own",tc:x.sky}),a.jsx("text",{x:108,y:46,textAnchor:"middle",fill:x.txt,fontSize:"18",fontWeight:"700",children:"="}),a.jsx(le,{x:120,y:20,w:92,h:42,stroke:x.rose,label:"LIABILITIES",sub:"what you owe",tc:x.rose}),a.jsx("text",{x:224,y:46,textAnchor:"middle",fill:x.tx rogress:k})]})}const yt=[{num:1,week:"Week 1",marks:10,source:"Revision Q1",title:"Financial vs Management Accounting & Business Structures",scenario:"Accounting plays a crucial role in supporting business decision-making.",required:["Explain the difference between financial and management accounting, and discuss how each supports decision-making for different users.","Using an example, identify which form of accounting would be most useful for a small partnership considering expansion, and why."],model:["FINANCIAL accounting reports to EXTERNAL users (investors, creditors, banks, the ATO). It must follow AASB standards, is mainly historical, general-purpose, and reported on a regular cycle (usually annually). It supports outsiders’ decisions (whether to invest or lend) and provides accountability.","MANAGEMENT accounting is for INTERNAL managers. It has no mandatory format, is flexible and forward-looking (budgets, forecasts, cost & break-even analysis), can be produced anytime, and may include non-financial information. It supports planning, control and internal decision-making.","For a small partnership considering EXPANSION: MANAGEMENT accounting is most useful. The partners need internal, forward-looking information — projected costs, a cash-flow forecast and CVP/break-even analysis — to judge whether the expansion is affordable and profitable. Financial accounting only reports past results. (A partnership also has unlimited joint liability, which may prompt considering a company structure.)"]},{num:2,week:"Week 2",marks:6,source:"Exam topic (theory)",title:"Conceptual Framework — Qualitative Characteristics",scenario:"The Conceptual Framework sets out the qualities that make financial information useful to users.",required:["Explain the TWO fundamental qualitative characteristics.","Explain the FOUR enhancing qualitative characteristics."],model:["FUNDAMENTAL (information must have both): RELEVANCE — capable of making a difference to decisions (predictive value, confirmatory value, materiality). FAITHFUL REPRESENTATION — complete, neutral (unbiased) and free from error.","ENHANCING (improve usefulness): COMPARABILITY (consistent across entities/periods); VERIFIABILITY (independent observers could agree); TIMELINESS (available before it loses its influence); UNDERSTANDABILITY (classified and presented clearly).","The fundamentals come first — if information is not relevant and faithfully represented, the enhancing characteristics cannot make it useful."]},{num:3,week:"Week 5",marks:12,source:"Revision Q4",title:"Cash vs Accrual Accounting & Depreciation",scenario:"Harry’s Variety Store purchased a laptop for $3,000 on 1 January 2023. The laptop is expected to last 3 years and have no residual value.",required:["Explain the difference between cash and accrual accounting, and state which basis the business must use.","Explain why depreciation is recorded rather than expensing the full $3,000 in the year of purchase.","Calculate annual depreciation using the straight-line method.","Identify which accounts are affected and how they appear in the financial statements."],model:["Cash vs accrual: cash accounting records when cash is received/paid; ACCRUAL records revenue when EARNED and expenses when INCURRED, regardless of cash. AASB requires the accrual basis (it applies the matching principle).","Why depreciate: the MATCHING PRINCIPLE — the laptop provides benefits over 3 years, so its cost is spread across those 3 years. Expensing the full $3,000 in Year 1 would overstate Year 1 expenses (understate profit) and understate later expenses. Depreciation is a non-cash expense.","Straight-line: (Cost − Residual) ÷ Useful life = ($3,000 − $0) ÷ 3 = $1,000 per year.","Accounts: Depreciation Expense $1,000 → Income Statement (reduces profit). Accumulated Depreciation (contra-asset) → Balance Sheet, reducing the carrying amount: Yr1 $2,000, Yr2 $1,000, Yr3 $0."]},{num:4,week:"Week 2",marks:12,source:"Revision Q2",title:"Conceptual Framework — Definitions & Recognition Criteria",scenario:"Highope Ltd has spent $300,000 exploring for platinum. The company holds a mining licence but has no previous mining experience, and no platinum has yet been found.",required:["Assess whether the exploration costs meet the DEFINITION and RECOGNITION criteria for an asset under the Conceptual Framework.","If not, discuss whether they should instead be recognised as an expense, providing justification."],model:["Asset definition — 3 criteria: (1) a present economic resource with potential future economic benefits, (2) controlled by the entity, (3) arising from a past event. Past event: YES ($300,000 spent). Control: PARTLY (the mining licence). Future benefits: NOT demonstrated — no platinum found and no experience, so benefits are not probable.","Recognition: an item is recognised only if it provides USEFUL information — RELEVANT and a FAITHFUL REPRESENTATION. Recording $300,000 as an asset when recovery is unproven would not faithfully represent the position and could mislead users.","Conclusion: the costs FAIL asset recognition → recognise as an EXPENSE in the period incurred, because there is no reliable evidence of future benefits and capitalising would overstate assets. (AASB 6 allows capitalising exploration costs only where recovery is probable — not the case here.)"]},{num:5,week:"Week 3",marks:10,source:"Revision Q3",title:"Transaction Analysis (Accounting Equation)",scenario:"A custom-sneaker business begins with the owner contributing $15,000 cash. During the month: (1) buys $5,000 of equipment for cash; (2) buys $2,000 of supplies on credit; (3) earns $3,000 cash sales; (4) repays $500 of the loan; (5) the owner withdraws $1,000.",required:["Show the effect of each transaction on the accounting equation (Assets = Liabilities + Equity).","Calculate the final balances of Assets, Liabilities and Owner’s Equity.","Briefly explain why the equation must always remain in balance."],model:["Start: Cash +$15,000; Equity (Capital) +$15,000. (1) Equipment +$5,000, Cash −$5,000 (asset swap). (2) Supplies +$2,000; Accounts Payable +$2,000. (3) Cash +$3,000; Equity (Revenue) +$3,000. (4) Cash −$500; Liabilities −$500. (5) Cash −$1,000; Equity (Drawings) −$1,000.","Final balances: Assets = Cash $11,500 + Equipment $5,000 + Supplies $2,000 = $18,500. Liabilities = $1,500. Equity = $15,000 + $3,000 − $1,000 = $17,000. Check: $18,500 = $1,500 + $17,000 ✓.","Why it balances: every transaction has a dual effect, and equity is DEFINED as assets minus liabilities, so the equation is an identity that must always hold (double-entry)."]},{num:6,week:"Week 6",marks:10,source:"Revision Q5",title:"Balance Day Adjustments",scenario:"For each transaction, determine the end-of-period adjustment: (1) earned $2,000 interest not yet received; (2) owe $3,500 wages for work performed; (3) paid $1,800 in advance for advertising; (4) received $4,000 in advance from a customer; (5) paid $1,200 insurance covering the next 6 months; (6) incurred $900 electricity not yet paid; (7) earned $3,000 service income not yet invoiced; (8) customer prepays $2,500 for services next period.",required:["Identify whether each transaction is accrued, prepaid, or unearned.","Explain how each affects the accounting equation (Assets ↑/↓, Liabilities ↑/↓, Equity ↑/↓).","Briefly justify your reasoning."],model:["1. ACCRUED REVENUE — Asset ↑ (receivable), Equity ↑ (revenue). Earned, not received.","2. ACCRUED EXPENSE — Liability ↑ (wages payable), Equity ↓ (expense). Incurred, not paid.","3. PREPAID EXPENSE — Asset ↑ (prepaid advertising); expensed as used. Paid in advance.","4. UNEARNED REVENUE — Asset ↑ (cash), Liability ↑ (unearned revenue). Cash before service.","5. PREPAID EXPENSE — Asset ↑ (prepaid insurance); expensed over 6 months. Paid in advance.","6. ACCRUED EXPENSE — Liability ↑ (electricity payable), Equity ↓ (expense). Incurred, not paid.","7. ACCRUED REVENUE — Asset ↑ (receivable), Equity ↑ (revenue). Earned, not invoiced.","8. UNEARNED REVENUE — Asset ↑ (cash), Liability ↑ (unearned revenue). Not yet earned."]},{num:7,week:"Week 7",marks:12,source:"Revision Q6",title:"Financial Statements — focus on Cash Flows",scenario:"Classify the cash-flow activity of each transaction for a retail business: (1) paid supplier for inventory; (2) purchased equipment; (3) issued shares for cash; (4) received payment from a customer; (5) paid interest on a loan; (6) sold an old delivery van; (7) repaid part of a bank loan; (8) paid wages; (9) paid a dividend to the owner; (10) received a cash refund from an equipment supplier.",required:["Classify each as Operating (O), Investing (I), or Financing (F).","Write a one-line justification for each classification.","Explain how each activity type (O, I, F) helps different users understand the cash position."],model:["1. O — paying for inventory is core operations. 2. I — buying a long-term asset. 3. F — raising equity capital. 4. O — collecting revenue from customers. 5. O — interest paid is operating under AASB.","6. I — disposing of a long-term asset. 7. F — repaying debt finance. 8. O — wages are day-to-day operating costs. 9. F — distribution to owners. 10. I — relates to the equipment (asset) purchase.","How each helps users: OPERATING shows whether the core business generates enough cash to sustain itself (liquidity). INVESTING shows whether the business is growing or contracting its asset base. FINANCING shows how the business is funded and what is returned to capital providers."]},{num:8,week:"Week 10",marks:8,source:"Revision Q8",title:"Cost-Volume-Profit (CVP) Analysis",scenario:"A small café sells toasties for $12 each. Variable cost per toastie is $4, and total fixed costs are $4,000 per month.",required:["Calculate the contribution margin per unit, the break-even point in units and in dollars, and the number of toasties for a target profit of $2,000.","If the selling price is reduced to $10 for a promotion (costs unchanged), explain the effect on the contribution margin, the break-even point and the risk profile.","Discuss one real-world decision where CVP analysis could help a manager choose between pricing or cost strategies."],model:["CM = $12 − $4 = $8. Break-even units = $4,000 ÷ $8 = 500 toasties. Break-even $ = 500 × $12 = $6,000. Target $2,000: ($4,000 + $2,000) ÷ $8 = 750 toasties.","Price to $10: new CM = $6 (down from $8); new break-even = $4,000 ÷ $6 ≈ 667 toasties (up from 500). RISK INCREASES — more units must be sold to break even, so the café is more exposed to a loss if volume doesn’t rise to offset the lower margin.","Real-world: a happy-hour discount. CVP tells the manager how many extra toasties must sell at the lower price to keep the same total contribution — if the expected volume increase doesn’t cover the lost margin, the promotion reduces profit."]},{num:9,week:"Week 11",marks:8,source:"Revision Q9",title:"Performance Measurement (ROI & Residual Income)",scenario:"Two divisions report: Alpha — Operating Profit $400,000, Total Investment $2,500,000, Required Return 10%. Beta — Operating Profit $280,000, Total Investment $1,600,000, Required Return 12%.",required:["Calculate the Return on Investment (ROI) and Residual Income (RI) for each division.","Based solely on ROI, which division appears to perform better? Based on RI, which creates more value above expectations?","Explain why a manager’s performance evaluation might differ depending on whether ROI or RI is used.","Identify one advantage and one limitation of each measure."],model:["ROI: Alpha = $400,000 ÷ $2,500,000 = 16%; Beta = $280,000 ÷ $1,600,000 = 17.5% → BETA better on ROI.","RI: Alpha = $400,000 − (10% × $2,500,000) = $150,000; Beta = $280,000 − (12% × $1,600,000) = $88,000 → ALPHA creates more value.","Why they differ: ROI is a ratio (favours the smaller, efficient Beta); RI is an absolute $ of value above the required return (favours the larger Alpha). On ROI alone a manager might reject a project earning above the required rate but below their current ROI (underinvestment); RI would accept it.","ROI — advantage: compares divisions of different sizes; limitation: short-term bias / may reject good projects. RI — advantage: encourages all value-adding projects (goal congruence); limitation: can’t fairly compare divisions of different sizes."]},{num:10,week:"Week 8 & 9",marks:12,source:"Revision Q7",title:"Financial Statement Analysis — Profitability & DuPont",scenario:"Pine Ltd reports for the year ended 30 June 2025: Sales $3,000,000; Net Profit $240,000; Average Total Assets $1,200,000.",required:["Calculate the profit margin, asset turnover, and ROA using the DuPont formula.","Explain how changes in profit margin and asset turnover can influence ROA differently.","Suggest one practical strategy a business could use to improve ROA through each component."],model:["Profit margin = $240,000 ÷ $3,000,000 = 8%. Asset turnover = $3,000,000 ÷ $1,200,000 = 2.5×. ROA (DuPont) = 8% × 2.5 = 20% (check: $240,000 ÷ $1,200,000 = 20%).","How each influences ROA: profit margin reflects cost control / pricing power (profit per $ of sales); asset turnover reflects efficiency (sales per $ of assets). Two firms can reach the same ROA differently — a luxury brand (high margin, low turnover) vs a supermarket (low margin, high turnover).","Strategies: improve MARGIN → cut operating costs or raise prices; improve TURNOVER → generate more sales from the same assets (better inventory management, faster receivables collection, dispose of idle assets)."]}],Us=yt.reduce((u,m)=>u+m.marks,0);function ep({onExit:u}){var nt,vt;const[m,c]=Z.useState("setup"),[w,k]=Z.useState({}),[v,S]=Z.useState({}),[T,I]=Z.useState({}),[O,R]=Z.useState(0),[F,U]=Z.useState(!1),[H,ie]=Z.useState(null),[te,G]=Z.useState(0),ve=Z.useRef(Sf()),Ie=Z.useRef({});Z.useEffect(()=>{Ie.current={answers:w,selfMarks:v,revealed:T,idx:O,endsAt:H,timed:F}}),Z.useEffect(()=>{if(m!=="running"||!F||!H)return;const B=()=>{const
