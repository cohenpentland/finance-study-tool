e EQUITY directly. They are a distribution to the owner, not a business cost."},{front:"Revenue vs Income",back:"Revenue is a sub-type of income (from ordinary activities). Income = revenue + gains."},{front:"Asset — 3 criteria (ALL needed)",back:"1) Present economic resource (potential future benefits), 2) Controlled by the entity, 3) Result of a past event."},{front:"Recognition criteria (course version)",back:"Meets the element DEFINITION + provides USEFUL info → it is RELEVANT and a FAITHFUL REPRESENTATION (complete, neutral, free from error)."}],5:[{front:"The accounting equation",back:"ASSETS = LIABILITIES + EQUITY. It ALWAYS balances (double-entry)."},{front:"Why must it always balance?",back:"Double-entry: every transaction has equal and opposite effects on at least two accounts."},{front:"Owner invests cash",back:"Assets ↑ (cash) and Equity ↑ (capital) by the same amount."},{front:"Buy equipment for cash",back:"ASSET SWAP — Cash ↓, Equipment ↑. Total assets unchanged."},{front:"Buy supplies on credit",back:"Assets ↑ (supplies) and Liabilities ↑ (accounts payable)."},{front:"Cash sales (earn revenue)",back:"Assets ↑ (cash) and Equity ↑ (via revenue)."},{front:"Repay a loan",back:"Assets ↓ (cash) and Liabilities ↓ (loan). Equity unchanged."},{front:"Owner withdraws cash (drawings)",back:"Assets ↓ (cash) and Equity ↓ (drawings). NOT an expense."},{front:"Pay an expense (e.g. rent) in cash",back:"Assets ↓ (cash) and Equity ↓ (expense reduces the owner's stake)."},{front:"Sneaker business final balances",back:"Assets $18,500 = Liabilities $1,500 + Equity $17,000. ✓ Balanced. (Cash $11,500 + Equipment $5,000 + Supplies $2,000 = $18,500.)"},{front:"Collect cash from a debtor",back:"ASSET SWAP — Cash ↑, Receivable ↓. No new revenue (earned earlier)."}],6:[{front:"What are balance day adjustments?",back:"End-of-period entries that update the accounts for accrual accounting — matching revenue & expenses to the right period."},{front:"Accrued Revenue",back:"Earned but NOT yet received. Effect: Asset ↑ (receivable), Equity ↑ (revenue). e.g. interest earned, not received."},{front:"Accrued Expense",back:"Incurred but NOT yet paid. Effect: Liability ↑ (payable), Equity ↓ (expense). e.g. wages owed, electricity owed."},{front:"Prepaid Expense",back:"Paid in advance for a FUTURE benefit. Starts as an ASSET; becomes an expense as it's used. e.g. insurance prepaid."},{front:"Unearned Revenue",back:"Cash received BEFORE earning it. A LIABILITY until the service is delivered. e.g. customer deposit/prepayment."},{front:"When unearned revenue is finally earned",back:"Liability ↓ and Revenue ↑ (Equity ↑). The obligation is satisfied."},{front:"Insurance paid for next 6 months — type?",back:"PREPAID expense → recorded as an asset first, expensed gradually as the months pass."},{front:"Customer prepays for next period — type?",back:"UNEARNED revenue → a liability (you owe them the service)."},{front:"When are adjustments made?",back:"At the END of the reporting period, before the financial statements are prepared."},{front:"Forget to record an accrued expense — effect?",back:"Expenses understated → PROFIT OVERSTATED (and liabilities understated)."},{front:"Accruals vs Prepayments (2×2)",back:"Accrued revenue = ASSET. Accrued expense = LIABILITY. Prepaid (unearned) revenue = LIABILITY. Prepaid expense = ASSET."},{front:"Bad debts: two methods",back:"Direct write-off — expense only WHEN a debt goes bad (violates matching). Allowance method — ESTIMATE bad debts in the period of sale (PREFERRED, matches expense to revenue)."},{front:"Allowance for Doubtful Debts — what is it?",back:"A CONTRA-ASSET that reduces Accounts Receivable. Recording it raises Bad Debts Expense (Equity ↓) in the sale period."}],7:[{front:"Three main financial statements",back:"1) Income Statement (P&L), 2) Balance Sheet, 3) Statement of Cash Flows."},{front:"Income Statement formula",back:"Revenue − Expenses = Net Profit. Covers a PERIOD."},{front:"Balance Sheet equation",back:"Assets = Liabilities + Equity. A snapshot at a POINT IN TIME."},{front:"Cash Flow Statement — 3 sections",back:"Operating (O), Investing (I), Financing (F)."},{front:"Operating activities (O)",back:"Day-to-day trading: receipts from customers, paying suppliers/wages, interest paid. The business 'heartbeat'."},{front:"Investing activities (I)",back:"Buying/selling LONG-TERM assets: equipment, property, vehicles (and related refunds)."},{front:"Financing activities (F)",back:"How the business is funded: issuing shares, borrowing, repaying loans, paying dividends/drawings."},{front:"Why is operating cash flow so important?",back:"It shows the core business generates REAL cash — not just paper profit. A profitable firm can still run out of cash."},{front:"Profit but negative operating cash flow — why?",back:"Profit is accrual-based. Credit customers may not have paid yet, or stock was built up, tying up cash."},{front:"Dividends/drawings — which section?",back:"FINANCING outflow (a return to the owners)."},{front:"The FOUR financial statements",back:"1) Balance Sheet (position, point in time), 2) Income Statement (profit, over a period), 3) Statement of Changes in Equity (links profit to balance sheet), 4) Cash Flow Statement (cash, O/I/F)."},{front:"Income statement structure",back:"Sales − Cost of Sales = GROSS PROFIT; + Other Income − Operating Expenses = PROFIT BEFORE TAX; − Income Tax = PROFIT AFTER TAX."},{front:"Statement of Changes in Equity",back:"Opening Equity + Profit − Drawings = Closing Equity. The closing figure flows onto the Balance Sheet."}],8:[{front:"Contribution Margin (CM) per unit",back:"Selling Price − Variable Cost per unit. What each unit contributes to fixed costs, then profit."},{front:"Break-even point (units)",back:"Fixed Costs ÷ CM per unit. The sales level where profit = 0."},{front:"Break-even point (dollars)",back:"Break-even units × Selling Price (or Fixed Costs ÷ CM ratio)."},{front:"Target profit (units)",back:"(Fixed Costs + Target Profit) ÷ CM per unit."},{front:"CM ratio",back:"CM per unit ÷ Selling Price. e.g. $8 ÷ $12 = 66.7%."},{front:"Café example: $12 price, $4 variable, $4,000 fixed",back:"CM = $8. Break-even = 500 units ($6,000). For $2,000 profit = 750 units."},{front:"Price drop $12 → $10 effect",back:"CM falls to $6, break-even rises to ~667 units. Lower CM = MORE units needed = HIGHER risk."},{front:"Fixed vs Variable costs",back:"FIXED stay constant in total regardless of volume (e.g. rent). VARIABLE change with volume (e.g. ingredients)."},{front:"Higher CM per unit → break-even?",back:"LOWER break-even (fixed costs covered faster) = less risk."},{front:"What is CVP analysis used for?",back:"Deciding pricing and cost strategies — e.g. effect of a price cut, a promotion, or a cost change on profit."},{front:"Margin of safety",back:"How far actual/budgeted sales are ABOVE break-even — the cushion before the business makes a loss."},{front:"Fixed vs Variable vs Mixed costs",back:"Fixed: constant in total (rent). Variable: change in proportion to activity (materials). Mixed/semi-variable: both parts (electricity = service charge + usage)."},{front:"Relevant costs & the sunk cost rule",back:"Only FUTURE costs that DIFFER between alternatives are relevant. A SUNK cost (already incurred) is ALWAYS irrelevant. Opportunity cost = benefit given up."},{front:"Make-or-buy & special order rules",back:"Make-or-buy: choose the lower of make vs buy cost. Special order: accept if incremental revenue > incremental cost (and there's idle capacity)."}],9:[{front:"Return on Investment (ROI)",back:"Operating Profit ÷ Total Investment × 100. A percentage return on invested funds."},{front:"Residual Income (RI)",back:"Operating Profit − (Total Investment × Required Rate). Profit ABOVE the minimum required, in dollars."},{front:"Alpha: $400k profit, $2.5m investment, 10%",back:"ROI = 16%. RI = $400k − $250k = $150,000."},{front:"Beta: $280k profit, $1.6m investment, 12%",back:"ROI = 17.5%. RI = $280k − $192k = $88,000."},{front:"ROI vs RI — who wins?",back:"By ROI, BETA wins (17.5% > 16%). By RI, ALPHA wins ($150k > $88k). They can disagree!"},{front:"What does RI > 0 mean?",back:"The division earned MORE than its required return — it created value for the firm."},{front:"ROI's big limitation (dysfunctional behaviour)",back:"A manager may REJECT a project that beats the required rate but lowers their division's average ROI — hurting the firm."},{front:"How does RI fix that problem?",back:"RI encourages accepting ANY project with positive RI (above the required return) → better goal congruence."},{front:"ROI advantage & limitation",back:"ADVANTAGE: simple %, compares different-sized divisions fairly. LIMITATION: can drive dysfunctional/short-term decisions."},{front:"RI advantage & limitation",back:"ADVANTAGE: promotes goal congruence. LIMITATION: absolute $ figure → harder to compare different-sized divisions."},{front:"'Required rate of return' = ?",back:"The minimum acceptable return — the cost of capital / hurdle rate used in the RI calculation."},{front:"Responsibility centres",back:"Cost centre (costs only); Revenue centre (revenue only); Profit centre (costs & revenue → profit); Investment centre (costs, revenue & assets → ROI/RI)."},{front:"DuPont ROI decomposition",back:"ROI = Profit Margin × Investment Turnover = (Profit ÷ Sales) × (Sales ÷ Investment). Shows WHY ROI is high or low."},{front:"ROI 'asset age' problem",back:"Older assets have a low book value, which inflates ROI — making old-asset divisions look better and discouraging new investment."},{front:"Balanced Scorecard — 4 perspectives",back:"Financial · Customer · Internal Business Processes · Innovation & Improvement (Learning & Growth). Adds non-financial, leading indicators to financial lagging ones."}],10:[{front:"Profit Margin",back:"Net Profit ÷ Sales × 100. Cents of profit per $1 of sales."},{front:"Asset Turnover",back:"Sales ÷ Average Total Assets. How efficiently assets generate sales (a multiple, e.g. 2.5×)."},{front:"Return on Assets (ROA)",back:"Net Profit ÷ Average Total Assets × 100. Return per dollar of assets."},{front:"DuPont formula",back:"ROA = Profit Margin × Asset Turnover. Splits ROA into profitability AND efficiency."},{front:"Pine Ltd worked example",back:"PM = 8% ($240k/$3m), AT = 2.5× ($3m/$1.2m), ROA = 8% × 2.5 = 20%. ✓"},{front:"Return on Equity (ROE)",back:"Net Profit ÷ Owner's Equity × 100. The return earned for the owners."},{front:"Gross Profit Margin",back:"Gross Profit ÷ Sales × 100. Profitability before operating expenses."},{front:"Improve ROA via PROFIT MARGIN",back:"Earn more profit per sale: cut costs or raise prices."},{front:"Improve ROA via ASSET TURNOVER",back:"Generate more sales from the same assets: faster inventory turnover, quicker receivables, sell idle assets."},{front:"What does a HIGH asset turnover suggest?",back:"Assets are used efficiently — lots of sales per dollar of assets."},{front:"What does a LOW asset turnover suggest?",back:"Possibly excess, idle or underutilised assets relative to the sales being generated."},{front:"The 4 ratio categories",back:"Liquidity (short-term cash ability), Asset Efficiency (how hard assets work), Capital Structure (solvency/risk), Profitability (operating success)."},{front:"Liquidity: Current vs Quick ratio",back:"Current Ratio = Current Assets ÷ Current Liabilities. Quick (acid-test) Ratio = (Current Assets − Inventory) ÷ Current Liabilities — stricter, excludes slow inventory."},{front:"Asset efficiency: turnover → days",back:"Inventory Turnover = COGS ÷ Avg Inventory; Debtors Turnover = Sales ÷ Avg Debtors. Days = 365 ÷ turnover. Higher turnover / fewer days = better."},{front:"Capital structure (solvency) ratios",back:"Debt to Total Assets = Total Liabilities ÷ Total Assets (higher = more risk). Times Interest Earned = EBIT ÷ Interest Expense (higher = safer)."}]},Ua="fst:v1";function Ar(){return{version:1,quiz:{},flashcards:{},exams:[]}}function Ba(){try vs Management Accounting",columns:["Feature","Financial","Management"],rows:[["Audience","Mainly external (investors, banks, ATO)","Internal only (managers)"],["Reports","General purpose","Specific purpose"],["Detail","Broad overview","Quite detailed"],["Rules","Must follow accounting standards (AASB)","No restrictions"],["Frequency","Mainly annual / semi-annual","Whenever required"],["Time horizon","Mainly historical","Past AND future"],["Info type","Money terms; objective & verifiable","Can include non-financial info"]]},{type:"callout",tone:"tip",body:"Memory hook — Financial = your TAX RETURN (formal, for outsiders, about the past). Management = your PRIVATE NOTES (flexible, for you, about the future). For the exam’s “small partnership considering expansion”, the answer is MANAGEMENT accounting (budgets, forecasts, CVP/break-even)."},{type:"table",heading:"The Three Business Structures",columns:["Structure","Owners","Liability"],rows:[["Sole Proprietorship","1","Unlimited personal liability"],["Partnership","2 or more","Shared — unlimited (joint & several)"],["Company (Ltd / Pty Ltd)","Shareholders","Limited to amount invested"]],note:"A company is a SEPARATE LEGAL ENTITY — only it offers limited liability."},{type:"cards",heading:"Public vs Proprietary Companies",items:[{name:"Public (Ltd)",icon:"🏛️",accent:"blue",points:["Can sell shares to the public","Typically large","Extensive regulation","Must report"]},{name:"Proprietary (Pty Ltd)",icon:"🏢",accent:"green",points:["Cannot sell shares publicly","Usually smaller","Moderate regulation","Reporting depends on size"]}]},{type:"callout",tone:"key",body:"Corporate regulation (Australia): the CORPORATIONS ACT is the primary law, enforced by ASIC. Other regulators: ASX, ACCC, RBA, APRA, ATO."}]},2:{sections:[{type:"intro",heading:"Qualitative Characteristics",body:"The Conceptual Framework sets the qualities that make financial information USEFUL for decisions. There are two FUNDAMENTAL characteristics (information must have both) and four ENHANCING characteristics that improve usefulness."},{type:"cards",heading:"Two Fundamental Characteristics",items:[{name:"Relevance",icon:"🎯",accent:"sky",desc:"Capable of MAKING A DIFFERENCE to decisions — it has predictive value, confirmatory value, and considers materiality."},{name:"Faithful Representation",icon:"✅",accent:"green",desc:"COMPLETE, NEUTRAL (unbiased) and FREE FROM ERROR."}]},{type:"cards",heading:"Four Enhancing Characteristics (C-V-T-U)",items:[{name:"Comparability",icon:"⚖️",accent:"blue",desc:"Consistent across entities and periods, so users can spot similarities and differences."},{name:"Verifiability",icon:"🔍",accent:"purple",desc:"Independent observers could confirm the information."},{name:"Timeliness",icon:"⏰",accent:"amber",desc:"Available before it loses its capacity to influence decisions."},{name:"Understandability",icon:"💡",accent:"sky",desc:"Classified, characterised and presented clearly for knowledgeable users."}]},{type:"callout",tone:"tip",body:"Q2 is 6 marks — likely one mark per characteristic with a brief definition. Don’t confuse fundamental with enhancing. If Relevance and Faithful Representation aren’t met, the other four don’t matter."}]},3:{sections:[{type:"intro",heading:"Cash vs Accrual Accounting",body:"CASH accounting records transactions only when cash is received or paid. ACCRUAL accounting records revenue when EARNED and expenses when INCURRED, regardless of the cash flow. AASB requires the accrual basis for general-purpose reports because it applies the matching principle and gives a truer picture of performance."},{type:"table",heading:"Cash vs Accrual",columns:["","Cash basis","Accrual basis"],rows:[["Revenue recorded when","Cash received","Earned (regardless of cash)"],["Expense recorded when","Cash paid","Incurred (regardless of cash)"],["Required by AASB?","No","Yes"],["Matches revenue & expense?","No","Yes — matching principle"]],note:"Example: work done in June, paid in July → accrual recognises the revenue in JUNE."},{type:"intro",heading:"Depreciation & Amortisation",body:"DEPRECIATION is the systematic allocation of a TANGIBLE asset’s cost over its useful life (AMORTISATION does the same for INTANGIBLE assets). It applies the matching principle. It is a NON-CASH expense and does NOT measure the loss in market value. Depreciation expense = the amount charged this period; accumulated depreciation = the total charged over the asset’s life."},{type:"formulas",heading:"Three Depreciation Methods",items:[{name:"Straight-line",formula:"(Cost − Residual Value) ÷ Useful Life",meaning:"Equal expense each year. Laptop $3,000, 3 yrs, $0 → $1,000/yr."},{name:"Reducing-balance",formula:"(Cost − Accumulated Depreciation) × Rate",meaning:"Higher expense early; applied to the carrying amount (e.g. computers)."},{name:"Units-of-production",formula:"[(Cost − Residual) ÷ Total est. units] × Units used",meaning:"Based on use, not time (e.g. km driven, machine hours)."},{name:"Carrying amount",formula:"Cost − Accumulated Depreciation",meaning:"Book value — NOT market/resale value."}]},{type:"callout",tone:"key",body:"In the statements: Depreciation EXPENSE → Income Statement (reduces profit). Accumulated depreciation → Balance Sheet (a contra-asset reducing the asset’s carrying amount)."}]},4:{sections:[{type:"intro",heading:"The 5 Elements of Financial Statements",body:"The Conceptual Framework defines five building blocks. Knowing the precise definitions — and applying each criterion to the scenario — is high-value exam content (Q4 is 12 marks of analysis)."},{type:"cards",heading:"The Five Elements",items:[{name:"Asset",icon:"🏦",accent:"green",desc:"A present economic resource controlled by the entity as a result of past events."},{name:"Liability",icon:"📕",accent:"red",desc:"A present obligation to transfer an economic resource as a result of past events."},{name:"Owner’s Equity",icon:"🧮",accent:"sky",desc:"The residual interest in the assets after deducting all liabilities (Assets − Liabilities)."},{name:"Income",icon:"📈",accent:"blue",desc:"Increases in assets / decreases in liabilities that increase equity — excluding owner contributions."},{name:"Expense",icon:"📉",accent:"amber",desc:"Decreases in assets / increases in liabilities that decrease equity — excluding distributions to owners."}]},{type:"cards",heading:"The 3 Criteria (ALL must be met)",items:[{name:"Asset",icon:"🟢",accent:"green",points:["Present economic resource (potential to produce future benefits)","Controlled by the entity","Result of a past event"]},{name:"Liability",icon:"🔴",accent:"red",points:["Present obligation (no practical ability to avoid)","To transfer an economic resource","Result of a past event"]}]},{type:"callout",tone:"key",body:"Recognition criteria (for assets AND liabilities): an item is recognised only if it provides USEFUL information — i.e. it is RELEVANT and a FAITHFUL REPRESENTATION. (Older texts phrase this as “probable + reliably measurable”.)"},{type:"callout",tone:"tip",body:"Highope Ltd ($300k platinum): control (licence) and past event are arguable, but future benefits are NOT probable (no platinum found, no experience), so recognising an asset would not be relevant/faithful → EXPENSE it. Always link every criterion back to the scenario facts using “because”."}]},5:{sections:[{type:"intro",heading:"The Accounting Equation",body:"Every transaction is recorded so the accounting equation stays in balance. Each transaction has a MINIMUM of two effects (dual effect) — this is the heart of double-entry accounting."},{type:"formulas",heading:"The Equation",items:[{name:"Basic equation",formula:"Assets = Liabilities + Owner’s Equity",meaning:"Resources = how they were financed (lenders + owners)."},{name:"Extended equation",formula:"A = L + OE + Income − Expenses + Capital − Drawings",meaning:"Income & capital ADD to equity; expenses & drawings SUBTRACT."}]},{type:"table",heading:"Transaction Patterns",columns:["Transaction","Effect"],rows:[["Owner invests cash","Assets ↑, Equity ↑"],["Buy asset with cash","Assets ↑↓ (swap — net zero)"],["Buy asset on credit","Assets ↑, Liabilities ↑"],["Earn cash revenue","Assets ↑, Equity ↑"],["Pay cash expense","Assets ↓, Equity ↓"],["Repay a loan","Assets ↓, Liabilities ↓"],["Owner withdraws (drawings)","Assets ↓, Equity ↓ (NOT an expense)"]]},{type:"callout",tone:"key",body:"Sneaker business final balances: Assets $18,500 (Cash $11,500 + Equipment $5,000 + Supplies $2,000) = Liabilities $1,500 + Equity $17,000 ($15,000 capital + $3,000 revenue − $1,000 drawings). Always do the balance check. Use the interactive step-through below."}]},6:{sections:[{type:"intro",heading:"Balance Day Adjustments",body:"Accounting divides the business’s life into artificial reporting periods. Balance day adjustments are end-of-period entries that apply the ACCRUAL basis — putting revenues and expenses in the correct period regardless of when cash moved."},{type:"table",heading:"The 4 Types (Accruals vs Prepayments)",columns:["","Accruals","Prepayments"],rows:[["Revenues","Accrued revenue → ASSET","Prepaid (unearned) revenue → LIABILITY"],["Expenses","Accrued expense → LIABILITY","Prepaid expense → ASSET"]],note:"Trigger words: “not yet received/paid” = accrual. “In advance / prepaid” = prepayment."},{type:"cards",heading:"Effect on the Equation",items:[{name:"Accrued Revenue",icon:"💰",accent:"green",desc:"Earned, not yet received → Asset ↑ (receivable), Equity ↑ (revenue). e.g. $2,000 interest earned."},{name:"Accrued Expense",icon:"📄",accent:"red",desc:"Incurred, not yet paid → Liability ↑ (payable), Equity ↓ (expense). e.g. $3,500 wages owed."},{name:"Prepaid Expense",icon:"⏳",accent:"blue",desc:"Paid in advance → Asset first; as used, Asset ↓ & Equity ↓. e.g. $1,200 insurance for 6 months."},{name:"Unearned Revenue",icon:"🎫",accent:"purple",desc:"Cash received before earning → Liability; as earned, Liability ↓ & Revenue ↑. e.g. $4,000 customer advance."}]},{type:"intro",heading:"Bad & Doubtful Debts",body:"When a business sells on credit, some debtors won’t pay. The accrual concept requires accounting for this. There are two methods."},{type:"cards",heading:"Two Methods",items:[{name:"Direct Write-Off",icon:"✂️",accent:"amber",desc:"Write the debt off as a Bad Debts Expense only WHEN it goes bad (Accounts Receivable ↓, Expense ↑). Criticism: the loss often lands in a later period than the sale → violates matching."},{name:"Allowance Method",icon:"🛡️",accent:"green",desc:"ESTIMATE uncollectible debts and record an expense in the period of sale (Allowance for Doubtful Debts ↑ as a contra-asset, Bad Debts Expense ↑). PREFERRED — it matches the expense to the revenue period."}]},{type:"callout",tone:"warn",body:"Forgetting an accrued expense understates expenses → OVERSTATES profit (and understates liabilities)."}]},7:{sections:[{type:"intro",heading:"The Four Financial Statements",body:"The statements tell a connected story. Note there are FOUR — the Statement of Changes in Equity links profit to the Balance Sheet."},{type:"cards",heading:"The Four Statements",items:[{name:"Statement of Financial Position (Balance Sheet)",icon:"📊",accent:"sky",desc:"Assets, liabilities & equity at a POINT IN TIME. Assets = Liabilities + Equity."},{name:"Statement of Profit or Loss (Income Statement)",icon:"📈",accent:"green",desc:"Revenue & expenses over a PERIOD → profit."},{name:"Statement of Changes in Owner’s Equity",icon:"🔁",accent:"purple",desc:"Opening Equity + Profit − Drawings = Closing Equity. Bridges profit to the Balance Sheet."},{name:"Statement of Cash Flows",icon:"💵",accent:"amber",desc:"Actual cash in/out over a PERIOD, split into Operating, Investing, Financing."}]},{type:"formulas",heading:"Income Statement Structure",items:[{name:"Gross Profit",formula:"Sales − Cost of Sales"},{name:"Profit before tax",formula:"Gross Profit + Other Income − Operating Expenses"},{name:"Profit after tax",formula:"Profit before Tax − Income Tax Expense"}]},{type:"table",heading:"Cash Flow — Three Activities",columns:["Section","What it includes","Examples"],rows:[["Operating (O)","Day-to-day trading","Receipts from customers, payments to suppliers/employees, interest paid, tax"],["Investing (I)","Buying/selling long-term assets","Buy equipment, sell property, equipment refund"],["Financing (F)","How the business is funded","Issue shares, borrow/repay loans, dividends/drawings"]],note:"Exam traps: interest PAID = Operating (AASB); dividends paid = Financing; equipment refund = Investing."},{type:"callout",tone:"key",body:"Profit ≠ Cash. A profitable business can still run out of cash. Positive OPERATING cash flow is the key sign of health. Net change in cash = Operating + Investing + Financing."}]},8:{sections:[{type:"intro",heading:"What is CVP Analysis?",body:"Cost-Volume-Profit analysis examines how costs, volume and price affect profit. It is a MANAGEMENT accounting tool for planning profit, break-even, target profit, and short-term decisions. Key assumption: costs are either FIXED or VARIABLE."},{type:"cards",heading:"Cost Behaviour",items:[{name:"Fixed Costs",icon:"🏠",accent:"blue",desc:"Do NOT change with activity (rent, insurance, depreciation). Fixed cost PER UNIT falls as volume rises."},{name:"Variable Costs",icon:"📦",accent:"green",desc:"Change in direct proportion to activity (materials, commissions). Variable cost PER UNIT stays constant."},{name:"Mixed (Semi-variable)",icon:"🔀",accent:"amber",desc:"Both a fixed and a variable part (e.g. electricity = service charge + usage). Split before CVP."},{name:"Relevant Range",icon:"📏",accent:"sky",desc:"The activity range over which the fixed/variable assumptions hold."}]},{type:"formulas",heading:"Core CVP Formulas",items:[{name:"CM per unit",formula:"Selling Price − Variable Cost per unit"},{name:"CM Ratio",formula:"CM per unit ÷ Selling Price × 100"},{name:"Break-Even (units)",formula:"Fixed Costs ÷ CM per unit"},{name:"Break-Even (dollars)",formula:"Fixed Costs ÷ CM Ratio"},{name:"Target Profit (units)",formula:"(Fixed Costs + Target Profit) ÷ CM per unit"},{name:"Operating Profit",formula:"Contribution Margin − Fixed Costs",meaning:"The management-accounting income format: Sales − Variable = CM − Fixed = Profit."}]},{type:"table",heading:"Relevant Costs for Decisions",columns:["Term","Meaning"],rows:[["Relevant cost","A FUTURE cost that DIFFERS between alternatives"],["Incremental cost","The extra cost of choosing one option"],["Opportunity cost","The benefit given up by not choosing the next-best option"],["Sunk cost","A past cost already incurred — ALWAYS irrelevant"]],note:"Make-or-buy: choose the lower of make vs buy cost. Special order: accept if incremental revenue > incremental cost (idle capacity)."},{type:"callout",tone:"tip",body:"Café toastie: CM $8, break-even 500 units ($6,000), 750 units for $2,000 profit. Drop price to $10 → CM $6 → break-even 667 → MORE risk. Try the interactive calculator below."}]},9:{sections:[{type:"intro",heading:"Performance Measurement",body:"Organisations set a mission → strategy → objectives, then measure whether objectives are met. How performance is measured depends on the type of RESPONSIBILITY CENTRE a manager runs."},{type:"table",heading:"Responsibility Centres",columns:["Type","Manager controls…","Measured by"],rows:[["Cost Centre","Costs only","Variance from budgeted costs"],["Revenue Centre","Revenue only","Variance from budgeted revenue"],["Profit Centre","Costs & revenue","Profit (Revenue − Costs)"],["Investment Centre","Costs, revenue & assets","ROI or Residual Income"]],note:"Responsibility accounting: only judge managers on items WITHIN THEIR CONTROL."},{type:"formulas",heading:"ROI & Residual Income",items:[{name:"Return on Investment (ROI)",formula:"Operating Profit ÷ Total Investment × 100",meaning:"Alpha: $400k ÷ $2.5m = 16%. Beta: $280k ÷ $1.6m = 17.5%."},{name:"DuPont ROI",formula:"(Profit ÷ Sales) × (Sales ÷ Investment)",meaning:"Profit Margin × Investment Turnover."},{name:"Residual Income (RI)",formula:"Operating Profit − (Required Rate × Investment)",meaning:"Alpha: $400k − (10% × $2.5m) = $150k. Beta: $280k − (12% × $1.6m) = $88k."}]},{type:"cards",heading:"ROI vs RI",items:[{name:"ROI — advantages",icon:"✅",accent:"green",points:["Single, easy summary measure","Compares divisions of DIFFERENT sizes (a ratio)","Encourages efficient asset use"]},{name:"ROI — disadvantages",icon:"⚠️",accent:"amber",points:["Short-term bias — may reject good projects that dilute ROI","Asset-age problem: old assets → low book value → inflated ROI","Distorted by different accounting policies"]},{name:"RI — advantage",icon:"✅",accent:"green",desc:"Accepts ANY project earning above the required rate → better value-creating decisions. RI > 0 = value created."},{name:"RI — limitation",icon:"⚠️",accent:"amber",desc:"An absolute $ figure → can’t fairly compare divisions of different sizes."}]},{type:"cards",heading:"The Balanced Scorecard (Kaplan & Norton)",items:[{name:"Financial",icon:"💰",accent:"green",desc:"“How do we look to shareholders?” — ROI, RI, profit margin, revenue growth."},{name:"Customer",icon:"🤝",accent:"sky",desc:"“How do customers see us?” — satisfaction, market share, retention."},{name:"Internal Business Processes",icon:"⚙️",accent:"blue",desc:"“What must we excel at?” — defect rate, cycle time, efficiency."},{name:"Innovation & Improvement",icon:"🌱",accent:"purple",desc:"“Can we keep improving?” — training, new-product revenue, R&D."}]},{type:"callout",tone:"key",body:"Financial measures alone are LAGGING indicators. The Balanced Scorecard adds non-financial perspectives so short-term profit isn’t chased at the expense of long-term health."}]},10:{sections:[{type:"intro",heading:"Financial Statement Analysis",body:"Ratios turn raw statements into insight. Always compare to a benchmark: prior years (intra-entity / trend), competitors (inter-entity), or industry averages. There are FOUR categories of ratios."},
